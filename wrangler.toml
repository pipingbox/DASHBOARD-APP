name = "pipingbox-app"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./app/frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "cd app/frontend && npm run build"

# ---------------------------------------------------------------------------
# Production environment (PB-CF-MIGRATION 5-5b gate 1: preview/prod split).
# Deployed ONLY via .github/workflows/deploy-production.yml -- manual
# workflow_dispatch with an explicit commit SHA, gated behind the GitHub
# "production" Environment. NEVER deployed by a push to main.
#
# PB-DRIFT-001 cutover (Gaspar GO 2026-08-24): app.pipingbox.com/* is served
# by this Worker via a zone_name Worker Route -- NOT a Custom Domain.
# Rationale: the route intercepts at the Cloudflare edge before the request
# reaches the legacy Atoms origin, so the legacy DNS record stays untouched
# (A app -> 107.150.101.9, proxied, TTL Auto) and rollback is instant:
# remove this [[env.production.routes]] block and redeploy -- traffic falls
# straight back to the legacy origin with zero DNS changes.
# ---------------------------------------------------------------------------
[env.production]
name = "pipingbox-app-prod"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[env.production.routes]]
pattern = "app.pipingbox.com/*"
zone_name = "pipingbox.com"

# PB-WEB-007: apex and www now served by the same Worker.
# The Worker redirects app/* and www/* → pipingbox.com (301).
[[env.production.routes]]
pattern = "pipingbox.com/*"
zone_name = "pipingbox.com"

[[env.production.routes]]
pattern = "www.pipingbox.com/*"
zone_name = "pipingbox.com"

# ---------------------------------------------------------------------------
# PB-WEB-008 phase A: satellite retirement. Each route makes the Worker
# intercept the satellite at the edge and 301 it onto its canonical section.
# The legacy origin is NOT shut down — it stays reachable if the route is
# removed, so rollback is per-satellite and instant.
#
# Phase B (academy, jobs) is intentionally absent: both still expose a live
# /api/v1 backend that has never been inventoried. Blocked by PB-WEB-003.
# ---------------------------------------------------------------------------
[[env.production.routes]]
pattern = "tools.pipingbox.com/*"
zone_name = "pipingbox.com"

[[env.production.routes]]
pattern = "community.pipingbox.com/*"
zone_name = "pipingbox.com"

[[env.production.routes]]
pattern = "companies.pipingbox.com/*"
zone_name = "pipingbox.com"

[[env.production.routes]]
pattern = "early.pipingbox.com/*"
zone_name = "pipingbox.com"

# ---------------------------------------------------------------------------
# PB-WEB-002: academy.pipingbox.com/* is routed to this Worker to inject
# X-Robots-Tag: noindex. It is NOT a satellite retirement — the Worker proxies
# the legacy Atoms origin response untouched, so academy keeps serving its own
# content. Phase B (a real 301) stays blocked by PB-WEB-003.
#
# IMPORTANT — this route cannot be removed by `wrangler deploy`. The API token
# lacks the permission, and wrangler warns:
#   "Existing routes for this Worker in such zones will not be deleted."
# Rollback therefore requires deleting the route in the Cloudflare dashboard
# (Workers & Pages → pipingbox-app-prod → Settings → Domains & Routes), not
# just reverting this file.
# ---------------------------------------------------------------------------
[[env.production.routes]]
pattern = "academy.pipingbox.com/*"
zone_name = "pipingbox.com"

[env.production.assets]
directory = "./app/frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# PB-WEB-002: the Worker script must run BEFORE static assets are resolved.
# Without this, Cloudflare serves a matching asset — including the SPA
# fallback to index.html — without ever invoking the Worker, so foreign hosts
# routed here (academy) receive THIS app's index.html instead of their own
# origin. That exact regression happened on 2026-08-25.
# Canonical traffic is unaffected: the Worker's default branch still calls
# env.ASSETS.fetch(request).
run_worker_first = true
