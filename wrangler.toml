name = "pipingbox-app"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./app/frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "cd app/frontend && npm run build"

# ---------------------------------------------------------------------------
# Production environment (PB-CF-MIGRATION 5-5b gate 1: preview/prod split).
# Deployed ONLY via .github/workflows/deploy-production.yml -- manual
# workflow_dispatch with an explicit commit SHA, gated behind the GitHub
# "production" Environment. NEVER deployed by a push to main.
# Deliberately has NO [[routes]] / custom_domain yet: attaching
# app.pipingbox.com is a separate, explicitly-authorized step, not part
# of this config. See docs/PB-CF-MIGRATION-5-5b-preview-prod-separation.md
# ---------------------------------------------------------------------------
[env.production]
name = "pipingbox-app-prod"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "./app/frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
