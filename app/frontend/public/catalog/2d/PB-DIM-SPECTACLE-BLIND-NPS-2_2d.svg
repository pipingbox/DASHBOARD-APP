  <line x1="526.125" y1="288.875" x2="526.125" y2="219.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="530" y="60" width="240" height="186" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
