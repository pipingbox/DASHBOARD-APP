  <line x1="282.625" y1="367.625" x2="282.625" y2="402.625" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="488.45" y1="247.375" x2="511.55" y2="247.375" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="500" y="240.375" class="dim-text">Pipe OD</text>
  <text x="500" y="262.375" class="dim-sub">1.050" | 26.7 mm</text>
  <line x1="488.45" y1="303.45" x2="488.45" y2="242.375" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="511.55" y1="303.45" x2="511.55" y2="242.375" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="530" y="60" width="240" height="186" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="650" y="80" class="tbl-hdr">NPS 3/4 — Key Data</text>
  <line x1="545" y1="88" x2="755" y2="88" stroke="#eee" stroke-width=".5"/>
  <text x="550" y="105" class="tbl-key">NPS / DN</text>
  <text x="750" y="105" class="tbl-val">3/4 / 20</text>
  <text x="550" y="122" class="tbl-key">Class</text>
  <text x="750" y="122" class="tbl-val">150</text>
  <text x="550" y="139" class="tbl-key">D (disc OD)</text>
  <text x="750" y="139" class="tbl-val">3.875" | 98.4 mm</text>
  <text x="550" y="156" class="tbl-key">Pipe OD (spacer hole)</text>
  <text x="750" y="156" class="tbl-val">1.050" | 26.7 mm</text>
