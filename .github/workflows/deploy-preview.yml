name: Deploy Cloudflare Workers Preview

# PB-CF-MIGRATION step 5-5b: definitive build-variable mechanism.
# Triggered on every push to main. Injects VITE_SUPABASE_URL and
# VITE_SUPABASE_ANON_KEY as build-time env vars from GitHub Actions
# Secrets -- never hardcoded, never committed as a .env file, never
# depends on variables manually exported in a local shell.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with Workers Scripts:Edit
#   VITE_SUPABASE_URL      e.g. https://mwdauubztjxkbrefirbg.supabase.co
#   VITE_SUPABASE_ANON_KEY Supabase anon (public) key for the pipingbox project
#   VITE_POSTHOG_KEY       PostHog PUBLIC project API key (phc_..., project 271316).
#                          PB-OBSERVABILITY-001: public by design (shipped in the
#                          client bundle); NEVER a personal/private API key here.
#                          When absent, the observability layer is a fail-open no-op.
#
# Optional repo variables (Settings -> Secrets and variables -> Actions → Variables):
#   VITE_POSTHOG_HOST      PostHog cloud host, e.g. https://eu.i.posthog.com
#                          (default: EU cloud). Set only if the project lives on US.
#
# Deploys ONLY to pipingbox-app.pipingbox.workers.dev (preview). Does NOT
# touch app.pipingbox.com, DNS, Custom Domains, or routes -- wrangler.toml
# has no [[routes]] / custom_domain block, so this workflow cannot cause
# a cutover by itself.

on:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - 'wrangler.toml'
      - 'src/worker.ts'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-preview
  # Gate 5 remediation: NEVER cancel-in-progress. The shared group is also
  # held by the SHA-locked identity E2E job in auth-e2e.yml; cancelling the
  # running holder would either kill a live E2E mid-run or overwrite the
  # Worker it is testing. Queued deploys simply serialize instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (wrangler)
        run: npm ci

      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci

      - name: Diagnose secrets presence (no values printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "CLOUDFLARE_API_TOKEN set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo NO)"
          echo "CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "VITE_SUPABASE_URL set: $([ -n "$VITE_SUPABASE_URL" ] && echo yes || echo NO)"
          echo "VITE_SUPABASE_ANON_KEY set: $([ -n "$VITE_SUPABASE_ANON_KEY" ] && echo yes || echo NO)"

      - name: Diagnose Cloudflare auth (wrangler whoami)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy to Cloudflare Workers (preview only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PB-OBSERVABILITY-001: public PostHog project key (never private keys).
          # VITE_POSTHOG_KEY absent => observability layer builds as fail-open no-op.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # Tag every build with its commit SHA (error tracking per build).
          VITE_APP_VERSION: ${{ github.sha }}
          # Mark preview traffic so it can be excluded from production reports.
          VITE_APP_ENV: preview
        run: npx wrangler deploy
