      - name: Run REAL profile-stability E2E — documents open (no interception) + certificate save under translate DOM mutation
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/documents-open-real-sign.spec.ts tests/certifications-dom-mutation.spec.ts \
            --config=playwright.config.ts \
            --workers=1 \
            --reporter=line

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-open-real-e2e-results
