  <line x1="449.5" y1="370" x2="489.5" y2="370" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="449.5" y1="97.75" x2="489.5" y2="97.75" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="484.5" y1="97.75" x2="484.5" y2="370" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="492.5" y="228.875" class="dim-text" text-anchor="start">H</text>
  <text x="492.5" y="243.875" class="dim-sub" text-anchor="start">12.500" | 317.5 mm</text>
  <rect x="540" y="100" width="240" height="186" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="660" y="120" class="tbl-hdr">NPS 3 — Key Data</text>
  <line x1="555" y1="128" x2="765" y2="128" stroke="#eee" stroke-width=".5"/>
  <text x="560" y="145" class="tbl-key">NPS / DN</text>
  <text x="760" y="145" class="tbl-val">3 / 80</text>
  <text x="560" y="162" class="tbl-key">Class</text>
  <text x="760" y="162" class="tbl-val">150</text>
  <text x="560" y="179" class="tbl-key">F-to-F</text>
  <text x="760" y="179" class="tbl-val">7.500" | 190.5 mm</text>
  <text x="560" y="196" class="tbl-key">H (center-to-top)</text>
  <text x="760" y="196" class="tbl-val">12.500" | 317.5 mm</text>
  <text x="560" y="213" class="tbl-key">Handwheel</text>
  <text x="760" y="213" class="tbl-val">9.000" | 228.6 mm</text>
  <text x="560" y="230" class="tbl-key">Weight</text>
  <text x="760" y="230" class="tbl-val">30 kg</text>
  <text x="560" y="247" class="tbl-key">Standard</text>
  <text x="760" y="247" class="tbl-val">API 600</text>
  <text x="560" y="264" class="tbl-key">End type</text>
  <text x="760" y="264" class="tbl-val">Flanged RF</text>
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width=".5"/>
  <text x="40" y="648" class="note">Gate Valve per API 600, Class 150, Flanged RF ends.</text>
  <text x="40" y="663" class="note">F-to-F = face-to-face. H = center of bore to top of actuator.</text>
  <text x="40" y="678" class="note">Weight is approximate. All dimensions in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
</svg>