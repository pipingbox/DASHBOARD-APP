  <circle cx="500" cy="320" r="43" fill="#d8dce0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="500" cy="320" r="12" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="349.55" class="label" fill="#555">SPACER</text>
  <circle cx="530" cy="320" r="4" fill="white" stroke="#1a1a1a" stroke-width=".8"/>
