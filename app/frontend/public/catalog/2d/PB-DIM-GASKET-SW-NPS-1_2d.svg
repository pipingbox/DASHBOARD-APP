  <line x1="274.5" y1="259.5" x2="274.5" y2="229.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="365.5" y1="259.5" x2="365.5" y2="229.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="600" y="480" width="60" height="8" rx="1" fill="#b8bfc6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="472" class="dim-text">T</text>
  <text x="630" y="503" class="dim-sub">0.175" | 4.4 mm</text>
  <text x="630" y="458" class="label">Section</text>
  <rect x="530" y="120" width="240" height="169" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
