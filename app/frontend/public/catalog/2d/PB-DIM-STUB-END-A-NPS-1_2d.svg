<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">Stub End — Type A</text>
  <text x="40" y="60" class="subtitle">NPS 1 (DN 25) — Lap Joint</text>
  <text x="40" y="78" class="std-ref">MSS SP-43 / ASME B16.9-2018</text>

  <!-- PROFILE: cylindrical stub with flanged lap at top (stepped profile) -->
  <path d="M 290 430
           L 290 260
           L 265 260
           L 265 230
           L 435 230
           L 435 260
           L 410 260
           L 410 430
           Z" class="profile"/>

  <!-- Lap region fill (slightly different shade) -->
  <rect x="265" y="230" width="170" height="30" rx="2" fill="#d0d5da" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Bore line through stub -->
  <line x1="296" y1="430" x2="296" y2="260" class="bore"/>
  <line x1="404" y1="430" x2="404" y2="260" class="bore"/>

  <!-- CENTERLINE vertical -->
  <line x1="350" y1="460" x2="350" y2="190" class="centerline"/>
  <text x="362" y="185" class="label" fill="#999">CL</text>

  <!-- DIM L (overall length, vertical) -->
  <line x1="435" y1="230" x2="505" y2="230" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="410" y1="430" x2="505" y2="430" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="490" y1="230" x2="490" y2="430"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="515" y="326" class="dim-text">L</text>
  <text x="515" y="342" class="dim-sub">6.000"</text>
  <text x="515" y="356" class="dim-sub">152.4 mm</text>

  <!-- DIM D (pipe OD at bottom) -->
  <line x1="290" y1="430" x2="290" y2="480" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="410" y1="430" x2="410" y2="480" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="290" y1="465" x2="410" y2="465"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="350" y="460" class="dim-text">D</text>
  <text x="350" y="482" class="dim-sub">1.315" | 33.4 mm</text>

  <!-- DIM Lap OD (lap diameter at top) -->
  <line x1="265" y1="230" x2="265" y2="180" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="435" y1="230" x2="435" y2="180" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="265" y1="195" x2="435" y2="195"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="350" y="190" class="dim-text">Lap OD</text>
  <text x="350" y="210" class="dim-sub">1.840" | 46.7 mm</text>

  <!-- DIM T (lap thickness) -->
  <line x1="265" y1="230" x2="205" y2="230" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="265" y1="260" x2="205" y2="260" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="220" y1="230" x2="220" y2="260"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="249" class="dim-text">T</text>
  <text x="200" y="265" class="dim-sub">0.120"</text>
  <text x="200" y="279" class="dim-sub">3.0 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Stub End Type A per MSS SP-43 / ASME B16.9-2018.</text>
  <text x="40" y="666" class="note">L = overall length. D = pipe OD. Lap OD matches flange bore. T = lap thickness.</text>
  <text x="40" y="680" class="note">Wall thickness varies by schedule. All dimensions in inches and millimeters.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="220" width="240" height="175" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="240" class="label" font-weight="600" fill="#1a1a1a">NPS 1 — Key Data</text>
  <line x1="545" y1="248" x2="755" y2="248" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="265" class="note" text-anchor="start" fill="#555">NPS / DN</text>
  <text x="735" y="265" class="note" text-anchor="end">1 / 25</text>
  <text x="560" y="282" class="note" text-anchor="start" fill="#555">D (pipe OD)</text>
  <text x="735" y="282" class="note" text-anchor="end">1.315" | 33.4 mm</text>
  <text x="560" y="299" class="note" text-anchor="start" fill="#555">Lap OD</text>
  <text x="735" y="299" class="note" text-anchor="end">1.840" | 46.7 mm</text>
  <text x="560" y="316" class="note" text-anchor="start" fill="#555">L (overall length)</text>
  <text x="735" y="316" class="note" text-anchor="end">6.000" | 152.4 mm</text>
  <text x="560" y="333" class="note" text-anchor="start" fill="#555">T (lap thickness)</text>
  <text x="735" y="333" class="note" text-anchor="end">0.120" | 3.0 mm</text>
  <text x="560" y="350" class="note" text-anchor="start" fill="#555">Type</text>
  <text x="735" y="350" class="note" text-anchor="end">Type A</text>
  <text x="560" y="367" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="367" class="note" text-anchor="end">MSS SP-43 / B16.9</text>
  <text x="560" y="384" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="384" class="note" text-anchor="end">Lap Joint</text>

</svg>