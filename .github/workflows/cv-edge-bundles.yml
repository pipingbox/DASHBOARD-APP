name: CV Edge Function Bundles

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: 3a6db202e9455ef3605ffe6d07cd346dc9d4629e

      - name: Setup esbuild
        run: npm install --no-save esbuild@0.25.12

      - name: Bundle cv-extract
        run: |
          npx esbuild supabase/functions/cv-extract/index.ts \
            --bundle --format=esm --platform=neutral \
            --external:'https://*' --external:'npm:*' \
            --outdir=/tmp/cv-extract-bundle --out-name=index.ts
          mkdir -p artifact/cv-extract
          cp /tmp/cv-extract-bundle/index.ts artifact/cv-extract/index.ts

      - name: Bundle cv-apply-draft
        run: |
          npx esbuild supabase/functions/cv-apply-draft/index.ts \
            --bundle --format=esm --platform=neutral \
            --external:'https://*' --external:'npm:*' \
            --outdir=/tmp/cv-apply-draft-bundle --out-name=index.ts
          mkdir -p artifact/cv-apply-draft
          cp /tmp/cv-apply-draft-bundle/index.ts artifact/cv-apply-draft/index.ts

      - name: Upload cv-extract bundle
        uses: actions/upload-artifact@v4
        with:
          name: cv-extract-bundle
          path: artifact/cv-extract/index.ts
          if-no-files-found: error

      - name: Upload cv-apply-draft bundle
        uses: actions/upload-artifact@v4
        with:
          name: cv-apply-draft-bundle
          path: artifact/cv-apply-draft/index.ts
          if-no-files-found: error
