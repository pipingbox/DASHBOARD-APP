  <circle cx="500" cy="320" r="82" fill="#d8dce0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="500" cy="320" r="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="376.5" class="label" fill="#555">SPACER</text>
  <circle cx="566" cy="320" r="4" fill="white" stroke="#1a1a1a" stroke-width=".8"/>
