<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
    </style>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">Pipe Cap</text>
  <text x="40" y="60" class="subtitle">NPS 16 (DN 400) — Butt Weld End</text>
  <text x="40" y="78" class="std-ref">ASME B16.9-2018 | Cap: closes pipe end</text>

  <!-- CAP PROFILE (side view: hemisphere/dome on pipe stub) -->
  <path d="M 270 420
           L 270 310
           Q 270 260 350 260
           Q 430 260 430 310
           L 430 420
           Z" class="profile"/>

  <!-- Bore -->
  <path d="M 276 420
           L 276 316
           Q 276 266 350 266
           Q 424 266 424 316
           L 424 420" class="bore"/>

  <!-- CENTERLINE -->
  <line x1="350" y1="450" x2="350" y2="230" class="centerline"/>
  <text x="360" y="225" class="label" fill="#999">CL</text>

  <!-- DIM E (length) -->
  <line x1="430" y1="420" x2="500" y2="420" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="350" y1="260" x2="500" y2="260" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="485" y1="420" x2="485" y2="260"
        class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="510" y="336" class="dim-text">E</text>
  <text x="510" y="352" class="dim-sub">7.000"</text>
  <text x="510" y="366" class="dim-sub">177.8 mm</text>

  <!-- DIM D (outside diameter at open end) -->
  <line x1="270" y1="420" x2="270" y2="470" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="430" y1="420" x2="430" y2="470" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="270" y1="455" x2="430" y2="455"
        class="dim-line" marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="350" y="450" class="dim-text">D</text>
  <text x="350" y="472" class="dim-sub">16.000" | 406.4 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Dimensions per ASME B16.9-2018.</text>
  <text x="40" y="666" class="note">E = tangent line to cap crown. D = outside diameter. All dimensions in inches and millimeters.</text>
  <text x="40" y="680" class="note">Wall thickness varies by schedule.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="250" width="240" height="140" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="270" class="label" font-weight="600" fill="#1a1a1a">NPS 16 — Key Data</text>
  <line x1="545" y1="278" x2="755" y2="278" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="295" class="note" text-anchor="start" fill="#555">NPS / DN</text>
  <text x="735" y="295" class="note" text-anchor="end">16 / 400</text>
  <text x="560" y="312" class="note" text-anchor="start" fill="#555">D (outside dia.)</text>
  <text x="735" y="312" class="note" text-anchor="end">16.000" | 406.4 mm</text>
  <text x="560" y="329" class="note" text-anchor="start" fill="#555">E (length)</text>
  <text x="735" y="329" class="note" text-anchor="end">7.000" | 177.8 mm</text>
  <text x="560" y="346" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="346" class="note" text-anchor="end">ASME B16.9-2018</text>
  <text x="560" y="363" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="363" class="note" text-anchor="end">Butt Weld (BW)</text>

</svg>