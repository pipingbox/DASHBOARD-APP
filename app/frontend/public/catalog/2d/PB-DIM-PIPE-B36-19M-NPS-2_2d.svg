  <text x="40" y="60" class="subtitle">NPS 2 (DN 50) — Section at SCH 40S</text>
  <text x="40" y="78" class="std-ref">ASME B36.19M-2018</text>
  <path d="M 258.75 330 a 71.25 71.25 0 1 0 142.5 0 a 71.25 71.25 0 1 0 -142.5 0 Z M 267.99 330 a 62.010000000000005 62.010000000000005 0 1 0 124.02000000000001 0 a 62.010000000000005 62.010000000000005 0 1 0 -124.02000000000001 0 Z" fill-rule="evenodd" class="profile"/>
