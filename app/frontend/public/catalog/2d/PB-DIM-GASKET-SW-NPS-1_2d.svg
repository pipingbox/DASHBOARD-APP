  <line x1="355.0" y1="350.0" x2="355.0" y2="435.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="274.5" y1="234.5" x2="365.5" y2="234.5" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="320" y="227.5" class="dim-text">CR OD</text>
