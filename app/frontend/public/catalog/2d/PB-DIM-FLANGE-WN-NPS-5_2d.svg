  <text x="40" y="60" class="subtitle">NPS 5 (DN 125) — Class 150 — Raised Face</text>
  <text x="40" y="78" class="std-ref">ASME B16.5-2020 | WN RF</text>
  <rect x="281.2" y="200" width="18.799999999999997" height="200" class="profile"/>
  <rect x="300" y="226.9" width="4" height="146.2" fill="#d0d5da" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="290.59999999999997" cy="215" r="8.75" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="290.59999999999997" cy="385" r="8.75" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 281.2 235.6 L 211.2 244.4 L 211.2 355.6 L 281.2 364.4 Z" class="profile"/>
  <line x1="314" y1="264.58" x2="191.2" y2="264.58" class="bore"/>
