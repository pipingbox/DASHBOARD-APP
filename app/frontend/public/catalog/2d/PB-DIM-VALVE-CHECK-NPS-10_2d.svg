  <text x="655" y="120" class="tbl-hdr">NPS 10 — Key Data</text>
  <line x1="555" y1="128" x2="755" y2="128" stroke="#eee" stroke-width=".5"/><text x="560" y="145" class="tbl-key">NPS / DN</text><text x="750" y="145" class="tbl-val">10 / 250</text><text x="560" y="162" class="tbl-key">Class</text><text x="750" y="162" class="tbl-val">150</text><text x="560" y="179" class="tbl-key">F-to-F</text><text x="750" y="179" class="tbl-val">5" | 127 mm</text><text x="560" y="196" class="tbl-key">OD body</text><text x="750" y="196" class="tbl-val">15.5" | 393.7 mm</text><text x="560" y="213" class="tbl-key">Weight</text><text x="750" y="213" class="tbl-val">80 kg</text><text x="560" y="230" class="tbl-key">Standard</text><text x="750" y="230" class="tbl-val">API 594</text><text x="560" y="247" class="tbl-key">End type</text><text x="750" y="247" class="tbl-val">Wafer (between flanges)</text>
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width=".5"/>
  <text x="40" y="648" class="note">Check Valve per API 594, Class 150, wafer body — installed BETWEEN flanges; no integral flanges.</text>
  <text x="40" y="663" class="note">OD body must fit within the bolt circle of the mating ASME B16.5 Class 150 flanges.</text>
  <text x="40" y="678" class="note">Dual-plate arrangement shown schematically; internals are not dimensioned. Weight is approximate.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
