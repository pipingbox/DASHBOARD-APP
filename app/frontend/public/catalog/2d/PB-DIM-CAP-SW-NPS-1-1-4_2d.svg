  <path d="M 296.9117647058824 226.25 L 316.2132352941177 226.25 Q 386.5257352941177 320 316.2132352941177 413.75 L 296.9117647058824 413.75 Z" class="profile"/><rect x="296.9117647058824" y="246.1029411764706" width="49.67647058823528" height="147.7941176470588" class="bore"/><line x1="409.0882352941177" y1="226.25" x2="409.0882352941177" y2="413.75" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
