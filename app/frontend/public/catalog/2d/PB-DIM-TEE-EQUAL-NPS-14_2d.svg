<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">Equal Tee</text>
  <text x="40" y="60" class="subtitle">NPS 14 (DN 350) — Butt Weld Ends</text>
  <text x="40" y="78" class="std-ref">ASME B16.9-2018 | Equal Tee: run OD = branch OD</text>

  <!-- TEE PROFILE (cross-section side view) -->
  <!-- Run (horizontal pipe) -->
  <path d="M 170 310
           L 280 310
           L 280 150
           L 420 150
           L 420 310
           L 530 310
           L 530 450
           L 170 450
           Z" class="profile"/>

  <!-- Bore lines (inner wall) -->
  <line x1="170" y1="317" x2="287" y2="317" class="bore"/>
  <line x1="413" y1="317" x2="530" y2="317" class="bore"/>
  <line x1="170" y1="443" x2="530" y2="443" class="bore"/>
  <line x1="287" y1="310" x2="287" y2="150" class="bore"/>
  <line x1="413" y1="310" x2="413" y2="150" class="bore"/>

  <!-- CENTERLINES -->
  <line x1="140" y1="380" x2="560" y2="380" class="centerline"/>
  <line x1="350" y1="470" x2="350" y2="120" class="centerline"/>

  <!-- CL labels -->
  <text x="570" y="374" class="label" fill="#999">CL</text>
  <text x="360" y="115" class="label" fill="#999">CL</text>

  <!-- DIM C (run center-to-end, horizontal half) -->
  <line x1="350" y1="380" x2="350" y2="510" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="530" y1="450" x2="530" y2="510" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="350" y1="495" x2="530" y2="495"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="440" y="490" class="dim-text">C</text>
  <text x="440" y="510" class="dim-sub">8.000" | 203.2 mm</text>

  <!-- DIM C (left side mirror) -->
  <line x1="170" y1="450" x2="170" y2="510" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="170" y1="495" x2="350" y2="495"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="260" y="490" class="dim-text">C</text>

  <!-- DIM M (branch center-to-end, vertical) -->
  <line x1="350" y1="380" x2="200" y2="380" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="280" y1="150" x2="200" y2="150" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="215" y1="380" x2="215" y2="150"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="200" y="265" class="dim-text"
        transform="rotate(-90 200 265)">M</text>
  <text x="180" y="265" class="dim-sub"
        transform="rotate(-90 180 265)">8.000" | 203.2 mm</text>

  <!-- DIM D (outside diameter, at right end) -->
  <line x1="530" y1="310" x2="580" y2="310" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="530" y1="450" x2="580" y2="450" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="565" y1="310" x2="565" y2="450"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="595" y="376" class="dim-text">D</text>
  <text x="595" y="392" class="dim-sub">14.000"</text>
  <text x="595" y="406" class="dim-sub">355.6 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Dimensions per ASME B16.9-2018, Table 1.</text>
  <text x="40" y="666" class="note">C = center-to-end (run). M = center-to-end (branch). D = outside diameter.</text>
  <text x="40" y="680" class="note">For equal tee: run OD = branch OD. All dimensions in inches and millimeters.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="160" width="240" height="160" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="180" class="label" font-weight="600" fill="#1a1a1a">NPS 14 — Key Data</text>
  <line x1="545" y1="188" x2="755" y2="188" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="205" class="note" text-anchor="start" fill="#555">NPS</text>
  <text x="735" y="205" class="note" text-anchor="end">14</text>
  <text x="560" y="222" class="note" text-anchor="start" fill="#555">DN</text>
  <text x="735" y="222" class="note" text-anchor="end">350</text>
  <text x="560" y="239" class="note" text-anchor="start" fill="#555">C (run center-to-end)</text>
  <text x="735" y="239" class="note" text-anchor="end">8.000" | 203.2 mm</text>
  <text x="560" y="256" class="note" text-anchor="start" fill="#555">M (branch c-to-e)</text>
  <text x="735" y="256" class="note" text-anchor="end">8.000" | 203.2 mm</text>
  <text x="560" y="273" class="note" text-anchor="start" fill="#555">D (outside dia.)</text>
  <text x="735" y="273" class="note" text-anchor="end">14.000" | 355.6 mm</text>
  <text x="560" y="290" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="290" class="note" text-anchor="end">ASME B16.9-2018</text>
  <text x="560" y="307" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="307" class="note" text-anchor="end">Butt Weld (BW)</text>

</svg>