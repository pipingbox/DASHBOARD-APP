name: Auth E2E Gate

# Permanent authentication gate for PIPINGBOX deployments.
# - Uses only the dedicated disposable QA account stored in GitHub Secrets.
# - Never logs credentials.
# - Can be called by deploy-production.yml or run manually.
# - Runs the 7 automatable Auth E2E tests only; the intentionally-manual
#   OAuth/magic-link case is excluded from this CI gate.
# - Fails unless the automated suite is exactly 7/7 PASS with zero skipped.

on:
  workflow_call:
    inputs:
      target_url:
        description: 'Deployed origin to test'
        required: true
        type: string
      source_ref:
        description: 'Exact app commit/ref whose E2E tests must be executed'
        required: true
        type: string
    secrets:
      E2E_TEST_EMAIL:
        required: true
      E2E_TEST_PASSWORD:
        required: true

  workflow_dispatch:
    inputs:
      target_url:
        description: 'Deployed origin to test'
        required: true
        # Canonical origin. A manual dispatch used to default to
        # app.pipingbox.com, which only reaches production through the
        # PB-WEB-007 301, so a hand-run gate silently measured the legacy hop
        # instead of the origin users actually land on.
        default: 'https://pipingbox.com'
        type: string
      source_ref:
        description: 'Exact app commit/ref whose E2E tests must be executed'
        required: true
        default: 'main'
        type: string
      run_identity_e2e:
        description: 'Also run the PB-OBSERVABILITY-001 identity E2E spec (observability-identity-e2e)'
        required: false
        default: false
        type: boolean
      expected_sha:
        description: 'Full SHA the preview Worker must be serving (required when run_identity_e2e=true; the spec aborts before login on mismatch)'
        required: false
        default: ''
        type: string
      run_onboarding_e2e:
        description: 'Run ONLY the PB-OBSERVABILITY-001 onboarding E2E (observability-onboarding-e2e) in an isolated window — the 7/7 auth gate is skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_wfa_e2e:
        description: 'Run ONLY the PB-WORKFORCE-ACTIVATION B1 verification pack (WFA E2E + insertBefore regression + RLS worker-experiences + corrected rls-security + monetization kill-switch) in an isolated window'
        required: false
        default: false
        type: boolean
      run_dashboard_e2e:
        description: 'Run ONLY the PB-PDI-004 /dashboard DOM-mutation smoke (dashboard-dom-mutation, Android Chrome emulation) in an isolated window — the 7/7 auth gate and the other onboarding specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_cert_upload_e2e:
        description: 'Run ONLY the PB-DOCUMENT-INTAKE-001 document-upload E2E (document-upload-e2e, Android Chrome emulation, TUS resumable) in an isolated window — the 7/7 auth gate and the other specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_auth_callback_e2e:
        description: 'Run ONLY the PB-AUTH-CALLBACK-STALE-APP-001 callback/stale-version/path-normalization E2E (auth-callback-e2e, Android Chrome emulation) in an isolated window — the 7/7 auth gate and the other specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_stale_crossdeploy_e2e:
        description: 'Run ONLY the PB-AUTH-CALLBACK-STALE-APP-001 REAL cross-deploy E2E (stale-crossdeploy-e2e): logs in on the CURRENT preview deployment and WAITS (up to 45 min) for a deploy of expected_sha — the orchestrator dispatches deploy-preview.yml while this job holds an authenticated tab. The job has NO deploy-preview concurrency group on purpose (the preview Worker must change mid-run). Requires expected_env=preview.'
        required: false
        default: false
        type: boolean
      run_prod_stale_smoke:
        description: 'Run ONLY the PB-AUTH-CALLBACK-STALE-APP-001 PRODUCTION smoke (prod-stale-smoke): starts BEFORE the production deploy (authenticated tab on the old bundle polls /version.json up to 45 min), then verifies old-tab safety, manual-reload migration, callback exit, /profile%E2%81%A0 normalization and zero-PII wire. Requires expected_env=production and target_url=https://pipingbox.com.'
        required: false
        default: false
        type: boolean
      run_referral_aldo_e2e:
        description: 'Run ONLY the PB-REFERRAL-ALDO-001 referral-attribution E2E (referral-aldo) in an isolated window — the 7/7 auth gate and the other specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_documents_open_e2e:
        description: 'Run ONLY the PB-PROFILE-DOCUMENT-OPEN-FIRST-CLICK-001 documents-open E2E (documents-open-first-click, mobile + desktop) in an isolated window — the 7/7 auth gate and the other specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      run_documents_open_real_e2e:
        description: 'Run ONLY the PB-PROFILE-STABILITY-001 REAL documents-open E2E (documents-open-real-sign, ZERO interception on the Storage sign path; dedicated DOC_OPEN_E2E_* synthetic production accounts) — the 7/7 auth gate and the other specs are skipped for this dispatch'
        required: false
        default: false
        type: boolean
      expected_env:
        description: 'Expected PostHog environment of the target deployment (preview|production); the SHA-locked specs assert it in pre-flight'
        required: false
        default: 'preview'
        type: string

jobs:
  auth-e2e:
    name: Auth E2E — require 7/7 PASS
    # Gate 6: the onboarding E2E needs a truly isolated window (same QA
    # account, same preview Worker) — skip the auth gate for that dispatch.
    if: ${{ inputs.run_onboarding_e2e != true && inputs.run_wfa_e2e != true && inputs.run_dashboard_e2e != true && inputs.run_cert_upload_e2e != true && inputs.run_referral_aldo_e2e != true && inputs.run_auth_callback_e2e != true && inputs.run_stale_crossdeploy_e2e != true && inputs.run_prod_stale_smoke != true && inputs.run_documents_open_e2e != true && inputs.run_documents_open_real_e2e != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Validate target and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::target_url is required."
            exit 1
          fi
          if [ -z "${E2E_TEST_EMAIL:-}" ] || [ -z "${E2E_TEST_PASSWORD:-}" ]; then
            echo "::error::E2E_TEST_EMAIL and E2E_TEST_PASSWORD must both be configured as GitHub Secrets."
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "::error::Auth E2E target must use HTTPS."; exit 1 ;;
          esac

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Auth E2E — zero skipped allowed
        shell: bash
        run: |
          set -euo pipefail

          # The spec contains 7 automatable credential/session tests plus one
          # intentionally skipped OAuth/magic-link manual-verification test.
          # Exclude that manual-only test from this CI gate, then require an
          # exact 7/7 PASS so a missing-secret "all skipped" result can never
          # be mistaken for success.
          npx playwright test tests/auth-e2e.spec.ts \
            --config=playwright.config.ts \
            --grep-invert='OAuth/magic-link' \
            --reporter=json > playwright-results.json

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
          const statuses = [];

          function walk(value) {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) walk(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (result && typeof result.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') walk(child);
            }
          }

          walk(report);

          const count = (status) => statuses.filter((s) => s === status).length;
          const passed = count('passed');
          const skipped = count('skipped');
          const failed = count('failed');
          const timedOut = count('timedOut');
          const interrupted = count('interrupted');

          console.log(`Auth E2E result: passed=${passed}, skipped=${skipped}, failed=${failed}, timedOut=${timedOut}, interrupted=${interrupted}`);

          if (statuses.length === 0) {
            console.error('::error::Playwright produced no executable Auth E2E results.');
            process.exit(1);
          }
          if (skipped > 0) {
            console.error(`::error::Auth E2E gate rejected ${skipped} skipped automated test(s).`);
            process.exit(1);
          }
          if (failed > 0 || timedOut > 0 || interrupted > 0) {
            console.error('::error::Auth E2E gate contains failed/timed-out/interrupted tests.');
            process.exit(1);
          }
          if (passed !== 7 || statuses.length !== 7) {
            console.error(`::error::Auth E2E gate requires exactly 7 passed automated tests; observed passed=${passed}, total=${statuses.length}.`);
            process.exit(1);
          }

          console.log('Auth E2E gate PASS: 7/7 automated tests, zero skipped.');
          NODE

  identity-e2e:
    name: PB-OBSERVABILITY-001 identity E2E (preview, SHA-locked)
    if: ${{ inputs.run_identity_e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Gate 5 remediation: deploy and E2E must be one coordinated operation.
    # This job shares the deploy-preview.yml concurrency group, so it waits
    # for any in-flight preview deploy to finish, and no preview deploy can
    # overwrite the shared Worker while the identity E2E is running.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}

    steps:
      - name: Require expected_sha for the SHA-locked identity E2E
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_APP_VERSION:-}" ]; then
            echo "::error::expected_sha is required when run_identity_e2e=true (gate 5: the served build must be traceable to the tested SHA)."
            exit 1
          fi

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run identity E2E — served-SHA pre-flight + single clean pass
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/observability-identity-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

  onboarding-e2e:
    name: PB-OBSERVABILITY-001 onboarding E2E (preview, SHA-locked, isolated window)
    if: ${{ inputs.run_onboarding_e2e == true || inputs.run_dashboard_e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Gate 6: isolated window — this job shares the deploy-preview.yml
    # concurrency group (no preview deploy can overwrite the shared Worker
    # mid-run) and the dispatch is mutually exclusive with the identity E2E
    # and the 7/7 auth gate, so no other browser session touches the QA
    # account or PostHog during the run.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}
      EXPECTED_ENV: ${{ inputs.expected_env }}

    steps:
      - name: Require expected_sha and exclusive dispatch mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_APP_VERSION:-}" ]; then
            echo "::error::expected_sha is required when run_onboarding_e2e/run_dashboard_e2e=true (the served build must be traceable to the tested SHA)."
            exit 1
          fi
          if [ "${{ inputs.run_identity_e2e }}" = "true" ]; then
            echo "::error::run_onboarding_e2e/run_dashboard_e2e and run_identity_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi
          if [ "${{ inputs.run_wfa_e2e }}" = "true" ]; then
            echo "::error::run_onboarding_e2e/run_dashboard_e2e and run_wfa_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi
          if [ "${EXPECTED_ENV:-preview}" != "preview" ] && [ "${EXPECTED_ENV:-preview}" != "production" ]; then
            echo "::error::expected_env must be 'preview' or 'production' (got ${EXPECTED_ENV})."
            exit 1
          fi

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run onboarding E2E — SHA pre-flight, snapshot, funnel, restore
        if: ${{ inputs.run_dashboard_e2e != true }}
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/observability-onboarding-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

      # PB-UI-DOM-INSERTBEFORE-001: translator-grade DOM-mutation regression.
      # Same isolated window and QA account; the spec does its own authorized
      # reset + exact restore, so it is safe to run right after the funnel E2E.
      - name: Run onboarding DOM-mutation E2E — insertBefore regression
        if: ${{ inputs.run_dashboard_e2e != true }}
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/onboarding-dom-mutation.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

      # PB-UI-DOM-INSERTBEFORE-001 (/profile): mount + edit/save regression
      # for the real-device NO-GO (PB-ERR-JYAHES et al.). Same window/account.
      - name: Run profile DOM-mutation E2E — mount + edit/save regression
        if: ${{ inputs.run_dashboard_e2e != true }}
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/profile-dom-mutation.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

      # PB-UI-DOM-INSERTBEFORE-001 (/dashboard, PB-PDI-004): pending-
      # invitation Accept action under translator mutation — the production
      # 8x app_error loop (PB-ERR-WDNH8A et al., build cccf0d0). Hermetic:
      # synthetic invitation intercepted at PostgREST level, ZERO DB writes.
      - name: Run dashboard DOM-mutation E2E — invitation action regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/dashboard-dom-mutation.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

  cert-upload-e2e:
    name: PB-CERT-UPLOAD-UX-001 certificate-upload E2E (preview, SHA-locked, isolated window)
    if: ${{ inputs.run_cert_upload_e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same isolated window as the other disposable-QA specs: shares the
    # deploy-preview concurrency group so no preview deploy can overwrite the
    # shared Worker mid-run, and is mutually exclusive with the other modes.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}
      EXPECTED_ENV: ${{ inputs.expected_env }}

    steps:
      - name: Require expected_sha and exclusive dispatch mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_APP_VERSION:-}" ]; then
            echo "::error::expected_sha is required when run_cert_upload_e2e=true (the served build must be traceable to the tested SHA)."
            exit 1
          fi
          if [ "${{ inputs.run_identity_e2e }}" = "true" ]; then
            echo "::error::run_cert_upload_e2e and run_identity_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi
          if [ "${{ inputs.run_wfa_e2e }}" = "true" ]; then
            echo "::error::run_cert_upload_e2e and run_wfa_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi
          if [ "${{ inputs.run_dashboard_e2e }}" = "true" ]; then
            echo "::error::run_cert_upload_e2e and run_dashboard_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 'Run document-upload E2E (PB-DOCUMENT-INTAKE-001) — TUS resumable: happy path, interruption/resume, no_bytes_started regression, ZERO DIFF'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/document-upload-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cert-upload-e2e-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  auth-callback-e2e:
    name: PB-AUTH-CALLBACK-STALE-APP-001 callback/stale-version E2E (SHA-locked, isolated window)
    if: ${{ inputs.run_auth_callback_e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same isolated window as the other disposable-QA specs: shares the
    # deploy-preview concurrency group so no preview deploy can overwrite the
    # shared Worker mid-run, and is mutually exclusive with the other modes.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}
      EXPECTED_ENV: ${{ inputs.expected_env }}

    steps:
      - name: Require expected_sha and exclusive dispatch mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_APP_VERSION:-}" ]; then
            echo "::error::expected_sha is required when run_auth_callback_e2e=true (the served build must be traceable to the tested SHA)."
            exit 1
          fi
          if [ "${{ inputs.run_identity_e2e }}" = "true" ]; then
            echo "::error::run_auth_callback_e2e and run_identity_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi
          if [ "${{ inputs.run_cert_upload_e2e }}" = "true" ]; then
            echo "::error::run_auth_callback_e2e and run_cert_upload_e2e are mutually exclusive (same QA account, isolated window required)."
            exit 1
          fi

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 'Run auth-callback E2E (PB-AUTH-CALLBACK-STALE-APP-001) — callback exit, stale-version update loop-safety, /profile%E2%81%A0 normalization'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/auth-callback-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=line

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-callback-e2e-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  stale-crossdeploy-e2e:
    name: PB-AUTH-CALLBACK-STALE-APP-001 REAL cross-deploy E2E (waits for the orchestrator's deploy)
    if: ${{ inputs.run_stale_crossdeploy_e2e == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately NO concurrency group: the preview Worker MUST be allowed
    # to change mid-run (the orchestrator dispatches deploy-preview.yml with
    # expected_sha while this job holds an authenticated tab on the old one).
    timeout-minutes: 70
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}
      EXPECTED_ENV: ${{ inputs.expected_env }}

    steps:
      - name: Require expected_sha (preview) and exclusive dispatch mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_APP_VERSION:-}" ] || [ "${#EXPECTED_APP_VERSION}" -ne 40 ]; then
            echo "::error::expected_sha (full 40-char SHA of the deploy this test waits for) is required when run_stale_crossdeploy_e2e=true."
            exit 1
          fi
          if [ "${EXPECTED_ENV}" != "preview" ]; then
            echo "::error::run_stale_crossdeploy_e2e requires expected_env=preview (production uses run_prod_stale_smoke)."
            exit 1
          fi
          if [ "${{ inputs.run_prod_stale_smoke }}" = "true" ] || [ "${{ inputs.run_cert_upload_e2e }}" = "true" ] || [ "${{ inputs.run_auth_callback_e2e }}" = "true" ]; then
            echo "::error::run_stale_crossdeploy_e2e is mutually exclusive with the other isolated-window modes (same QA account)."
            exit 1
          fi

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 'Run cross-deploy E2E (holds an authenticated tab while the orchestrator deploys expected_sha)'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/stale-crossdeploy-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=list

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stale-crossdeploy-e2e-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  prod-stale-smoke:
    name: PB-AUTH-CALLBACK-STALE-APP-001 PRODUCTION smoke (starts BEFORE the production deploy)
    if: ${{ inputs.run_prod_stale_smoke == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No concurrency group: must run WHILE deploy-production.yml executes
    # (the tab on the old bundle polls /version.json until the deploy lands).
    timeout-minutes: 70
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_sha }}
      EXPECTED_ENV: ${{ inputs.expected_env }}

    steps:
      - name: Require expected_sha (production) and exclusive dispatch mode
        shell: bash
        run: |
          set -euo pipefail
