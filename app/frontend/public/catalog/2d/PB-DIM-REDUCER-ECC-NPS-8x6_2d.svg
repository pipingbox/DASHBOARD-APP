<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">Eccentric Reducer</text>
  <text x="40" y="60" class="subtitle">NPS 8×6 (DN 200×150) — Butt Weld Ends</text>
  <text x="40" y="78" class="std-ref">ASME B16.9-2018 | Eccentric: flat bottom (BOP aligned)</text>

  <!-- PROFILE: trapezoidal with flat bottom (right side aligned) -->
  <path d="M 260 400
           L 330 200
           L 440 200
           L 440 400
           Z" class="profile"/>

  <!-- Bore lines parallel to outer profile, offset by wt -->
  <line x1="266" y1="400" x2="336" y2="200" class="bore"/>
  <line x1="434" y1="400" x2="434" y2="200" class="bore"/>

  <!-- CENTERLINE vertical through center of large end -->
  <line x1="350" y1="160" x2="350" y2="440" class="centerline"/>
  <text x="362" y="155" class="label" fill="#999">CL</text>

  <!-- BOP (Bottom Of Pipe) reference line on flat side -->
  <line x1="440" y1="400" x2="440" y2="200" stroke="#c62828" stroke-width="0.7" stroke-dasharray="5 3"/>
  <text x="455" y="300" class="label" text-anchor="start" fill="#c62828">BOP</text>

  <!-- DIM H (overall length, vertical) -->
  <line x1="440" y1="400" x2="510" y2="400" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="440" y1="200" x2="510" y2="200" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="495" y1="200" x2="495" y2="400"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="525" y="296" class="dim-text">H</text>
  <text x="525" y="312" class="dim-sub">5.500"</text>
  <text x="525" y="326" class="dim-sub">139.7 mm</text>

  <!-- DIM D1 (large end OD, horizontal at bottom) -->
  <line x1="260" y1="400" x2="260" y2="450" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="440" y1="400" x2="440" y2="450" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="260" y1="435" x2="440" y2="435"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="350" y="430" class="dim-text">D1</text>
  <text x="350" y="452" class="dim-sub">8.625" | 219.1 mm</text>

  <!-- DIM D2 (small end OD, horizontal at top) -->
  <line x1="330" y1="200" x2="330" y2="150" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="440" y1="200" x2="440" y2="150" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="330" y1="165" x2="440" y2="165"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="385" y="160" class="dim-text">D2</text>
  <text x="385" y="180" class="dim-sub">6.625" | 168.3 mm</text>

  <!-- DIM offset (eccentricity annotation) -->
  <line x1="350" y1="200" x2="350" y2="120" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="385" y1="200" x2="385" y2="120" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="350" y1="130" x2="385" y2="130"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="367" y="125" class="dim-text">Offset</text>
  <text x="367" y="142" class="dim-sub">1.000" | 25.4 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Dimensions per ASME B16.9-2018.</text>
  <text x="40" y="666" class="note">H = overall length. D1 = large end OD. D2 = small end OD. Flat side at bottom (BOP).</text>
  <text x="40" y="680" class="note">Offset = (D1−D2)/2. Wall thickness varies by schedule. All dimensions in inches and millimeters.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="200" width="240" height="175" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="220" class="label" font-weight="600" fill="#1a1a1a">NPS 8×6 — Key Data</text>
  <line x1="545" y1="228" x2="755" y2="228" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="245" class="note" text-anchor="start" fill="#555">NPS</text>
  <text x="735" y="245" class="note" text-anchor="end">8 × 6</text>
  <text x="560" y="262" class="note" text-anchor="start" fill="#555">DN</text>
  <text x="735" y="262" class="note" text-anchor="end">200 × 150</text>
  <text x="560" y="279" class="note" text-anchor="start" fill="#555">D1 (large end OD)</text>
  <text x="735" y="279" class="note" text-anchor="end">8.625" | 219.1 mm</text>
  <text x="560" y="296" class="note" text-anchor="start" fill="#555">D2 (small end OD)</text>
  <text x="735" y="296" class="note" text-anchor="end">6.625" | 168.3 mm</text>
  <text x="560" y="313" class="note" text-anchor="start" fill="#555">H (length)</text>
  <text x="735" y="313" class="note" text-anchor="end">5.500" | 139.7 mm</text>
  <text x="560" y="330" class="note" text-anchor="start" fill="#555">Offset</text>
  <text x="735" y="330" class="note" text-anchor="end">1.000" | 25.4 mm</text>
  <text x="560" y="347" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="347" class="note" text-anchor="end">ASME B16.9-2018</text>
  <text x="560" y="364" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="364" class="note" text-anchor="end">Butt Weld (BW)</text>

</svg>