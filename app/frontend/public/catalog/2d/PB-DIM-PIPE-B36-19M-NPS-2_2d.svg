  <line x1="401.25" y1="413.25" x2="401.25" y2="451.25" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="258.75" y1="446.25" x2="401.25" y2="446.25" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="330" y="439.25" class="dim-text">OD</text>
