  <text x="40" y="648" class="note">Spiral Wound Gasket per ASME B16.20-2017, Class 150.</text>
  <text x="40" y="663" class="note">Type CGI: centering ring + inner ring. Filler: flexible graphite.</text>
  <text x="40" y="678" class="note">ID/OD = wound element. CR OD = centering ring OD. All dims in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
