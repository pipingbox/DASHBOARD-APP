  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width=".5"/>
  <text x="40" y="648" class="note">Welding Neck Flange per ASME B16.5, Class 150. Source: ferrobend manufacturer table (primary) + wermac drilling/thickness cross-check. CROSS_REFERENCE.</text>
  <text x="40" y="663" class="note">Butt-weld hub with smooth bore transition. Bore to be specified by purchaser (schedule dependent).</text>
  <text x="40" y="678" class="note">All dims in inches and mm. Weights are approximate.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
