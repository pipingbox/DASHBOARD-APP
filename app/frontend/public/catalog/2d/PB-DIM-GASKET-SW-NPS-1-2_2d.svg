<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs><style>
    .profile{stroke:#1a1a1a;stroke-width:2;fill:#e2e5e8}
    .bore{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:4 2}
    .centerline{stroke:#999;stroke-width:.8;stroke-dasharray:8 4;fill:none}
    .dim-line{stroke:#c62828;stroke-width:.9;fill:none}
    .dim-text{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#c62828;text-anchor:middle}
    .dim-sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c62828;text-anchor:middle}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;fill:#1a1a1a}
    .subtitle{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#555}
    .std-ref{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#888}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888}
    .label{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#999;text-anchor:middle}
    .tbl-hdr{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#1a1a1a;font-weight:600;text-anchor:middle}
    .tbl-key{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#555;text-anchor:start}
    .tbl-val{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888;text-anchor:end}
  </style>
  <marker id="as" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  <marker id="ae" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Spiral Wound Gasket</text>
  <text x="40" y="60" class="subtitle">NPS 1/2 (DN 15) — Class 150 — With Centering Ring</text>
  <text x="40" y="78" class="std-ref">ASME B16.20-2017 | Type CGI (inner + centering ring)</text>
  <circle cx="320" cy="310" r="35" fill="#d8dce0" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="320" cy="310" r="24" fill="#b8bfc6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="310" r="10" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="13" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="15" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="18" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="20" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="22" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="10" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="310" x2="380" y2="310" class="centerline"/>
  <line x1="320" y1="250" x2="320" y2="370" class="centerline"/>
  <text x="385" y="314" class="label" text-anchor="start">CL</text>
  <line x1="309.5" y1="385.0" x2="330.5" y2="385.0" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="320" y="378.0" class="dim-text">ID</text>
  <text x="320" y="400.0" class="dim-sub">0.750" | 19.1 mm</text>
  <line x1="309.5" y1="325.5" x2="309.5" y2="390.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="330.5" y1="325.5" x2="330.5" y2="390.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="295.5" y1="420.0" x2="344.5" y2="420.0" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="320" y="413.0" class="dim-text">OD</text>
  <text x="320" y="435.0" class="dim-sub">1.750" | 44.5 mm</text>
  <line x1="295.5" y1="339.5" x2="295.5" y2="425.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="344.5" y1="339.5" x2="344.5" y2="425.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="285.0" y1="245.0" x2="355.0" y2="245.0" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="320" y="238.0" class="dim-text">CR OD</text>
  <text x="320" y="260.0" class="dim-sub">2.500" | 63.5 mm</text>
  <line x1="285.0" y1="270.0" x2="285.0" y2="240.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="355.0" y1="270.0" x2="355.0" y2="240.0" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="600" y="480" width="60" height="8" rx="1" fill="#b8bfc6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="472" class="dim-text">T</text>
  <text x="630" y="503" class="dim-sub">0.175" | 4.4 mm</text>
  <text x="630" y="458" class="label">Section</text>
  <rect x="530" y="120" width="240" height="169" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="650" y="140" class="tbl-hdr">NPS 1/2 — Key Data</text>
  <line x1="545" y1="148" x2="755" y2="148" stroke="#eee" stroke-width=".5"/>
  <text x="550" y="165" class="tbl-key">NPS / DN</text>
  <text x="750" y="165" class="tbl-val">1/2 / 15</text>
  <text x="550" y="182" class="tbl-key">Class</text>
  <text x="750" y="182" class="tbl-val">150</text>
  <text x="550" y="199" class="tbl-key">ID</text>
  <text x="750" y="199" class="tbl-val">0.750" | 19.1 mm</text>
  <text x="550" y="216" class="tbl-key">OD (wound)</text>
  <text x="750" y="216" class="tbl-val">1.750" | 44.5 mm</text>
  <text x="550" y="233" class="tbl-key">CR OD</text>
  <text x="750" y="233" class="tbl-val">2.500" | 63.5 mm</text>
  <text x="550" y="250" class="tbl-key">T</text>
  <text x="750" y="250" class="tbl-val">0.175" | 4.4 mm</text>
  <text x="550" y="267" class="tbl-key">Filler</text>
  <text x="750" y="267" class="tbl-val">Flexible Graphite</text>
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width=".5"/>
  <text x="40" y="648" class="note">Spiral Wound Gasket per ASME B16.20-2017, Class 150.</text>
  <text x="40" y="663" class="note">Type CGI: centering ring + inner ring. Filler: flexible graphite.</text>
  <text x="40" y="678" class="note">ID/OD = wound element. CR OD = centering ring OD. All dims in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
</svg>