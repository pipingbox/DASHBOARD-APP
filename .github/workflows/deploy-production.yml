name: Deploy Cloudflare Workers Production

# Production deploy is fully decoupled from preview (deploy-preview.yml).
# This workflow:
#   - NEVER runs on push -- workflow_dispatch only, triggered by hand.
#   - Requires an explicit commit SHA to deploy (no ambiguous "latest main").
#   - Is gated behind the GitHub Environment "production".
#   - Deploys to the SEPARATE Worker "pipingbox-app-prod".
#   - Keeps the cutover reversible: app.pipingbox.com/* is a Worker Route;
#     the legacy proxied A record remains in DNS as the rollback origin.
#   - Runs the static schema guard BEFORE deployment.
#   - Is NOT considered green after deploy alone: Auth E2E, public-route
#     contract, and RLS security contract must all pass.
#
# Rollback point: remove the production Worker Route and traffic falls back
# to A app -> 107.150.101.9 (proxied, TTL Auto). See the migration docs/Brain.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact commit SHA on main to deploy to production (required; must already be verified on preview)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Validate and confirm deployed commit SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          if [ -z "$INPUT_SHA" ]; then
            echo "::error::commit_sha input is required and cannot be empty."
            exit 1
          fi
          RESOLVED=$(git rev-parse HEAD)
          echo "Requested commit_sha: $INPUT_SHA"
          echo "Resolved HEAD:        $RESOLVED"
          case "$RESOLVED" in
            "$INPUT_SHA"*) echo "Commit SHA verified OK -- deploying exactly this commit to PRODUCTION." ;;
            *) echo "::error::Resolved HEAD ($RESOLVED) does not match requested commit_sha ($INPUT_SHA)."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schema contract static guard
        run: node scripts/check-schema-guard.mjs

      - name: i18n structural guard (locale schema drift)
        run: node scripts/check-i18n-schema.mjs

      - name: Validate i18n usage in public pages
        run: node scripts/check-i18n-usage.mjs

      # PB-I18N-LAYER2-001 (D6): debt paid — strict coverage is now a
      # production gate, not just a local check.
      - name: i18n coverage strict guard (7 locales at 100%)
        run: node scripts/check-i18n-coverage.mjs --strict

      - name: Catalog integrity guard
        run: node scripts/check-catalog.mjs

      - name: Install root deps (wrangler)
        run: npm ci

      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci

      # PB-OBSERVABILITY-PROD-ROLLOUT-001 (ChatGPT review): hard preflight —
      # never allow a production build to succeed with the observability layer
      # silently compiled as a no-op. The public project key must be present
      # and shaped like a PostHog public key (phc_...). Values are never
      # printed: only existence/shape booleans.
      - name: Preflight — production observability config present
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POSTHOG_KEY:-}" ]; then
            echo "::error::VITE_POSTHOG_KEY is missing — production build would ship with PostHog as a silent no-op. Aborting."
            exit 1
          fi
          case "$VITE_POSTHOG_KEY" in
            phc_*) echo "VITE_POSTHOG_KEY present and shaped as a public project key (value not printed).";;
            *) echo "::error::VITE_POSTHOG_KEY is present but does not look like a public project key (expected phc_ prefix). Refusing to build."; exit 1;;
          esac
          if [ -n "${VITE_POSTHOG_HOST:-}" ]; then
            case "$VITE_POSTHOG_HOST" in
              https://*) echo "VITE_POSTHOG_HOST present with https scheme (value not printed).";;
              *) echo "::error::VITE_POSTHOG_HOST must be an https URL."; exit 1;;
            esac
          else
            echo "VITE_POSTHOG_HOST not set — code default (EU host) will be used."
          fi

      - name: Deploy to Cloudflare Workers (PRODUCTION - pipingbox-app-prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # PB-OBSERVABILITY-PROD-ROLLOUT-001: public PostHog project key
          # (phc_..., project 271316; NEVER a personal/private API key here).
          # VITE_APP_ENV is NOT set: the layer defaults environment=production.
          # Replay/autocapture stay disabled in code; bot filter stays on
          # (opt_out_useragent_filter is preview-only in observability.ts).
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # Tag the production build with the exact deployed SHA so every
          # event carries app_version=<SHA> (error tracking per build).
          VITE_APP_VERSION: ${{ github.event.inputs.commit_sha }}
        run: npx wrangler deploy --env production

  auth-e2e:
    name: Production Auth E2E gate
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/auth-e2e.yml
    with:
      target_url: 'https://app.pipingbox.com'
      source_ref: ${{ github.event.inputs.commit_sha }}
    secrets:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

  public-routes:
    name: Production public-route contract
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_URL: 'https://app.pipingbox.com'
    steps:
      - name: Checkout exact deployed app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify approved public/protected route surface
        run: npx playwright test tests/public-routes.spec.ts --config=playwright.config.ts

  rls-security:
    name: Production RLS security contract
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout exact deployed app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Verify lead-table RLS contract
        run: npx playwright test tests/rls-security.spec.ts --config=playwright.config.ts
