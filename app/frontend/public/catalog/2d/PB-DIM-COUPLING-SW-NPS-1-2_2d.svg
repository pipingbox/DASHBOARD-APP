  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Full Coupling — Socket Weld</text>
  <text x="40" y="60" class="subtitle">NPS 1/2 (DN 15) — Class 3000</text>
  <text x="40" y="78" class="std-ref">ASME B16.11-2016 | Forged, socket weld ends</text>
  <rect x="261.8181818181818" y="226.25" width="136.36363636363635" height="187.49999999999997" class="profile"/><rect x="261.8181818181818" y="261.70454545454544" width="59.72727272727272" height="116.59090909090908" class="bore"/><rect x="338.4545454545454" y="261.70454545454544" width="59.72727272727272" height="116.59090909090908" class="bore"/><line x1="444.18181818181813" y1="226.25" x2="444.18181818181813" y2="413.75" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="452.18181818181813" y="320" class="dim-text" style="text-anchor:start">OD = 1.375"</text>
