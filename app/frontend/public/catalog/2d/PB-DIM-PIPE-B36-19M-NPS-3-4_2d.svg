  <text x="750" y="209" class="tbl-val">1.050" | 26.70 mm</text>
  <text x="540" y="226" class="tbl-key">Wall thickness</text>
  <text x="750" y="226" class="tbl-val">0.113" | 2.87 mm</text>
  <text x="540" y="243" class="tbl-key">Inside diameter</text>
  <text x="750" y="243" class="tbl-val">0.824" | 20.96 mm</text>
  <text x="540" y="260" class="tbl-key">Weight</text>
  <text x="750" y="260" class="tbl-val">1.69 kg/m</text>
