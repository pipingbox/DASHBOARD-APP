  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Gate Valve</text>
  <text x="40" y="60" class="subtitle">NPS 10 (DN 250) — Class 150 — Flanged Ends</text>
  <text x="40" y="78" class="std-ref">API 600 | Gate Valve</text>
