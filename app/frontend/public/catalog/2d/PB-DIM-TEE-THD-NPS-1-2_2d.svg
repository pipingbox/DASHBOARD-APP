<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs><style>
    .profile{stroke:#1a1a1a;stroke-width:2;fill:#e2e5e8}
    .bore{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:4 2}
    .centerline{stroke:#999;stroke-width:.8;stroke-dasharray:8 4;fill:none}
    .dim-line{stroke:#c62828;stroke-width:.9;fill:none}
    .dim-text{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#c62828;text-anchor:middle}
    .dim-sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c62828;text-anchor:middle}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;fill:#1a1a1a}
    .subtitle{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#555}
    .std-ref{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#888}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888}
    .label{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#999;text-anchor:middle}
    .tbl-hdr{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#1a1a1a;font-weight:600;text-anchor:middle}
    .tbl-key{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#555;text-anchor:start}
    .tbl-val{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888;text-anchor:end}
  </style>
  <marker id="as" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  <marker id="ae" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Equal Tee — Threaded</text>
  <text x="40" y="60" class="subtitle">NPS 1/2 (DN 15) — Class 3000</text>
  <text x="40" y="78" class="std-ref">ASME B16.11-2016 | Forged, threaded ends (NPT)</text>
  <rect x="200" y="302.8" width="260" height="114.4" class="profile"/><rect x="272.8" y="230" width="114.4" height="130" class="profile"/><rect x="200" y="325.056" width="51.480000000000004" height="69.888" class="bore"/><rect x="408.52" y="325.056" width="51.480000000000004" height="69.888" class="bore"/><rect x="295.056" y="230" width="69.888" height="51.480000000000004" class="bore"/><line x1="186" y1="360" x2="474" y2="360" class="centerline"/><line x1="330" y1="431.2" x2="330" y2="216" class="centerline"/><line x1="330" y1="451.2" x2="460" y2="451.2" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="395" y="445.2" class="dim-text">A run = 0.875"</text>
  <text x="395" y="467.2" class="dim-sub">22.2 mm</text><line x1="512" y1="360" x2="512" y2="230" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="520" y="295" class="dim-text" style="text-anchor:start">A br = 0.875"</text>
  <text x="520" y="309" class="dim-sub" style="text-anchor:start">22.2 mm</text><line x1="154" y1="302.8" x2="154" y2="417.2" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="162" y="360" class="dim-text" style="text-anchor:start">OD = 1.375"</text>
  <text x="162" y="374" class="dim-sub" style="text-anchor:start">34.9 mm</text><text x="330" y="208" class="label">NPT female thread</text>
  <text x="640" y="130" class="tbl-hdr">Dimensions</text>
  <text x="560" y="148" class="tbl-key">A run</text>
  <text x="725" y="148" class="tbl-val">0.875" / 22.2 mm</text>
  <text x="560" y="162" class="tbl-key">A branch</text>
  <text x="725" y="162" class="tbl-val">0.875" / 22.2 mm</text>
  <text x="560" y="176" class="tbl-key">OD</text>
  <text x="725" y="176" class="tbl-val">1.375" / 34.9 mm</text>
  <text x="40" y="640" class="note">Equal tee threaded per ASME B16.11-2016, Class 3000.</text>
  <text x="40" y="654" class="note">Threads: ASME B1.20.1 NPT. A = center-to-end.</text>
  <text x="40" y="668" class="note">All dims in inches and mm.</text>
