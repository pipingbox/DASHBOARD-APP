name: Deploy Cloudflare Workers Production

# Production deploy is fully decoupled from preview (deploy-preview.yml).
# This workflow:
#   - NEVER runs on push -- workflow_dispatch only, triggered by hand.
#   - Requires an explicit commit SHA to deploy (no ambiguous "latest main").
#   - Is gated behind the GitHub Environment "production".
#   - Deploys to the SEPARATE Worker "pipingbox-app-prod".
#   - Keeps the cutover reversible: app.pipingbox.com/* is a Worker Route;
#     the legacy proxied A record remains in DNS as the rollback origin.
#   - Runs the static schema guard BEFORE deployment.
#   - Is NOT considered green after deploy alone: Auth E2E, public-route
#     contract, and RLS security contract must all pass.
#
# Rollback point: remove the production Worker Route and traffic falls back
# to A app -> 107.150.101.9 (proxied, TTL Auto). See the migration docs/Brain.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact commit SHA on main to deploy to production (required; must already be verified on preview)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Validate and confirm deployed commit SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          if [ -z "$INPUT_SHA" ]; then
            echo "::error::commit_sha input is required and cannot be empty."
            exit 1
          fi
          RESOLVED=$(git rev-parse HEAD)
          echo "Requested commit_sha: $INPUT_SHA"
          echo "Resolved HEAD:        $RESOLVED"
          case "$RESOLVED" in
            "$INPUT_SHA"*) echo "Commit SHA verified OK -- deploying exactly this commit to PRODUCTION." ;;
            *) echo "::error::Resolved HEAD ($RESOLVED) does not match requested commit_sha ($INPUT_SHA)."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schema contract static guard
        run: node scripts/check-schema-guard.mjs

      - name: i18n structural guard (locale schema drift)
        run: node scripts/check-i18n-schema.mjs

      - name: Catalog integrity guard
        run: node scripts/check-catalog.mjs

      - name: Install root deps (wrangler)
        run: npm ci

      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci

      - name: Deploy to Cloudflare Workers (PRODUCTION - pipingbox-app-prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx wrangler deploy --env production

  auth-e2e:
    name: Production Auth E2E gate
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/auth-e2e.yml
    with:
      target_url: 'https://app.pipingbox.com'
      source_ref: ${{ github.event.inputs.commit_sha }}
    secrets:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

  public-routes:
    name: Production public-route contract
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_URL: 'https://app.pipingbox.com'
    steps:
      - name: Checkout exact deployed app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify approved public/protected route surface
        run: npx playwright test tests/public-routes.spec.ts --config=playwright.config.ts

  rls-security:
    name: Production RLS security contract
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout exact deployed app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact deploy SHA
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Verify lead-table RLS contract
        run: npx playwright test tests/rls-security.spec.ts --config=playwright.config.ts
