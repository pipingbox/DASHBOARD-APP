  <text x="40" y="648" class="note">Welding Neck Flange per ASME B16.5-2020, Class 150, Raised Face.</text>
  <text x="40" y="663" class="note">D = flange OD. BCD = bolt circle dia. T = flange thickness. Hub L = hub length.</text>
  <text x="40" y="678" class="note">Bore per ASME B36.10M. Wall thickness varies by schedule. All dims in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
