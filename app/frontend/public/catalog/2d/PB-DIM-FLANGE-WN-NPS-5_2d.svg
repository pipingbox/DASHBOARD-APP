<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs><style>
    .profile{stroke:#1a1a1a;stroke-width:2;fill:#e2e5e8}
    .bore{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:4 2}
    .bore-solid{stroke:#555;stroke-width:1.6;fill:none}
    .thread{stroke:#8a5a00;stroke-width:1.1;fill:none}
    .radius{stroke:#0b6b8a;stroke-width:1.6;fill:none}
    .centerline{stroke:#999;stroke-width:.8;stroke-dasharray:8 4;fill:none}
    .dim-line{stroke:#c62828;stroke-width:.9;fill:none}
    .dim-ext{stroke:#c62828;stroke-width:.5;stroke-dasharray:2 2}
    .dim-text{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#c62828;text-anchor:middle}
    .dim-sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c62828;text-anchor:middle}
