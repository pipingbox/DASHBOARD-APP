<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
      .angle-arc { stroke: #999; stroke-width: 0.7; fill: none; }
      .angle-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #999; text-anchor: middle; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">45° Lateral</text>
  <text x="40" y="60" class="subtitle">NPS 5 (DN 125) — Butt Weld Ends</text>
  <text x="40" y="78" class="std-ref">ASME B16.9-2018 | Branch at 45° to run</text>

  <!-- RUN PIPE (horizontal) -->
  <rect x="130" y="345" width="380" height="110" class="profile"/>

  <!-- BRANCH (45° going up-right) -->
  <path d="M 289 314
           L 409 194
           L 471 256
           L 351 376
           Z" class="profile"/>

  <!-- Bore lines: run -->
  <line x1="130" y1="352" x2="510" y2="352" class="bore"/>
  <line x1="130" y1="448" x2="510" y2="448" class="bore"/>
  <!-- Bore lines: branch -->
  <line x1="293" y1="318" x2="413" y2="198" class="bore"/>
  <line x1="347" y1="372" x2="467" y2="252" class="bore"/>

  <!-- CENTERLINES -->
  <!-- Run CL horizontal -->
  <line x1="100" y1="400" x2="540" y2="400" class="centerline"/>
  <!-- Branch CL at 45° -->
  <line x1="320" y1="400" x2="468" y2="252" class="centerline"/>

  <!-- CL labels -->
  <text x="550" y="394" class="label" fill="#999">CL</text>
  <text x="485" y="239" class="label" fill="#999">CL</text>

  <!-- 45° ANGLE INDICATOR -->
  <path d="M 360 400 A 40 40 0 0 0 348 372" class="angle-arc"/>
  <text x="375" y="388" class="angle-txt">45°</text>

  <!-- DIM C (run center-to-end, horizontal right side) -->
  <line x1="320" y1="400" x2="320" y2="515" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="510" y1="455" x2="510" y2="515" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="320" y1="500" x2="510" y2="500"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="415" y="495" class="dim-text">C</text>
  <text x="415" y="515" class="dim-sub">4.250" | 108.0 mm</text>

  <!-- DIM M (branch center-to-end, along branch axis) -->
  <!-- Extension lines perpendicular to branch axis -->
  <line x1="320" y1="400" x2="285" y2="365" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="440" y1="225" x2="405" y2="190" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="292" y1="372" x2="412" y2="197"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="342" y="274" class="dim-text"
        transform="rotate(-45 342 274)">M</text>
  <text x="327" y="259" class="dim-sub"
        transform="rotate(-45 327 259)">5.250" | 133.4 mm</text>

  <!-- DIM D (run OD at right end) -->
  <line x1="510" y1="345" x2="560" y2="345" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="510" y1="455" x2="560" y2="455" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="545" y1="345" x2="545" y2="455"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="575" y="396" class="dim-text">D</text>
  <text x="575" y="412" class="dim-sub">5.563"</text>
  <text x="575" y="426" class="dim-sub">141.3 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Dimensions per ASME B16.9-2018.</text>
  <text x="40" y="666" class="note">C = run center-to-end. M = branch center-to-end (along branch axis). D = outside diameter.</text>
  <text x="40" y="680" class="note">Branch at 45° to run axis. All dimensions in inches and millimeters.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="120" width="240" height="175" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="140" class="label" font-weight="600" fill="#1a1a1a">NPS 5 — Key Data</text>
  <line x1="545" y1="148" x2="755" y2="148" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="165" class="note" text-anchor="start" fill="#555">NPS / DN</text>
  <text x="735" y="165" class="note" text-anchor="end">5 / 125</text>
  <text x="560" y="182" class="note" text-anchor="start" fill="#555">C (run center-to-end)</text>
  <text x="735" y="182" class="note" text-anchor="end">4.250" | 108.0 mm</text>
  <text x="560" y="199" class="note" text-anchor="start" fill="#555">M (branch c-to-e)</text>
  <text x="735" y="199" class="note" text-anchor="end">5.250" | 133.4 mm</text>
  <text x="560" y="216" class="note" text-anchor="start" fill="#555">D (outside dia.)</text>
  <text x="735" y="216" class="note" text-anchor="end">5.563" | 141.3 mm</text>
  <text x="560" y="233" class="note" text-anchor="start" fill="#555">Branch angle</text>
  <text x="735" y="233" class="note" text-anchor="end">45°</text>
  <text x="560" y="250" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="250" class="note" text-anchor="end">ASME B16.9-2018</text>
  <text x="560" y="267" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="267" class="note" text-anchor="end">Butt Weld (BW)</text>

</svg>