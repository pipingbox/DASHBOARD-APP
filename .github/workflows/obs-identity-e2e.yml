name: PB-OBSERVABILITY-001 Identity E2E (preview)

# TEMPORARY verification workflow for the anonymous → authenticated identity
# gate of PB-OBSERVABILITY-001. Runs the dedicated identity spec against the
# preview deployment using the disposable QA account from GitHub Secrets.
# Credentials are never logged. This workflow is preview-only and will be
# removed (or folded into the permanent gates) once the ticket closes.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Preview origin to test'
        required: true
        default: 'https://pipingbox-app.pipingbox.workers.dev'
        type: string
      source_ref:
        description: 'Exact commit whose tests must run'
        required: true
        type: string

jobs:
  identity-e2e:
    name: Identity E2E — anonymous → authenticated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Validate target and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::target_url is required."
            exit 1
          fi
          if [ -z "${E2E_TEST_EMAIL:-}" ] || [ -z "${E2E_TEST_PASSWORD:-}" ]; then
            echo "::error::E2E_TEST_EMAIL and E2E_TEST_PASSWORD must be configured as GitHub Secrets."
            exit 1
          fi
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "::error::Identity E2E target must use HTTPS."; exit 1 ;;
          esac
          # Guard: the QA account must be the disposable one, never a real user.
          case "$E2E_TEST_EMAIL" in
            qa.e2e*) ;;
            *) echo "::error::E2E_TEST_EMAIL must be the disposable qa.e2e* account."; exit 1 ;;
          esac

      - name: Checkout exact tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run identity E2E
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/observability-identity-e2e.spec.ts \
            --config=playwright.config.ts \
            --reporter=line
