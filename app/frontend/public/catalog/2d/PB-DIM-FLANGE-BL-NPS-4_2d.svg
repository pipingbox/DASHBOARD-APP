  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Blind Flange</text>
  <text x="40" y="60" class="subtitle">NPS 4 (DN 100) — Class 150 — No bore</text>
  <text x="40" y="78" class="std-ref">ASME B16.5-2020 | BL RF</text>
