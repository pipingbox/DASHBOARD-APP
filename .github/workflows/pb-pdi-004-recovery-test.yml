name: PB-PDI-004 recovery email TEST

# TEST-only sender for the PB-PDI-004 account-recovery email, using the
# existing server-side SMTP provider (one.com — same credentials as the
# Supabase edge functions' _shared/email-provider.ts).
#
# Hard restrictions (double lock, mirrored in send-smtp.mjs):
#   - The ONLY accepted recipient is support@pipingbox.com. Any other
#     --to aborts before any network call.
#   - There is no "real" mode in this workflow. Contacting the affected
#     user requires the PO's second explicit GO and a separate decision.
#
# Required secrets (same values already configured on the Supabase project):
#   SMTP_HOST, SMTP_USER, SMTP_PASSWORD   (optional: SMTP_FROM, default
#   noreply@pipingbox.com)

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'TEST recipient (hard-locked to support@pipingbox.com)'
        required: false
        default: 'support@pipingbox.com'
        type: string
      display_name:
        description: 'Name rendered in the email (TEST default: Edward)'
        required: false
        default: 'Edward'
        type: string

jobs:
  send-test:
    name: Send single TEST to support@pipingbox.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce TEST-only recipient
        shell: bash
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          if [ "${RECIPIENT}" != "support@pipingbox.com" ]; then
            echo "::error::This workflow is TEST-only: recipient must be support@pipingbox.com (got ${RECIPIENT})."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mailer dependencies
        working-directory: scripts/pb-pdi-004-recovery
        run: npm ci

      - name: Send TEST email (single, support@pipingbox.com)
        working-directory: scripts/pb-pdi-004-recovery
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_HOST:-}" ] || [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "::error::SMTP_HOST / SMTP_USER / SMTP_PASSWORD secrets are not all configured (see repo Settings > Secrets)."
            exit 1
          fi
          node send-smtp.mjs --to "${{ inputs.recipient }}" --name "${{ inputs.display_name }}"
