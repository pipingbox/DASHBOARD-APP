  <line x1="298.5" y1="373.5" x2="298.5" y2="411.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="361.5" y1="373.5" x2="361.5" y2="411.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="298.5" y1="406.5" x2="361.5" y2="406.5" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="330" y="399.5" class="dim-text">OD</text>
