  <text x="40" y="648" class="note">ASME B36.19M-2018. OD is identical for every schedule of this NPS; WT/ID/weight shown for the section schedule only.</text>
  <text x="40" y="663" class="note">Other schedules for this NPS: see the dimensional table. No 3D render: pipes are 2D-only in V1 (3D rescoped to V1.1).</text>
  <text x="40" y="678" class="note">All dims in inches and mm. ID = OD - 2 x WT.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
</svg>
