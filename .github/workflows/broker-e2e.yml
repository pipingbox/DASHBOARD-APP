name: Broker Access E2E Gate

# Release gate for PB-STORAGE-SECURITY-001 secure-file-access broker hardening.
#
# Runs exclusively tests/secure-file-access-broker.spec.ts against a QA origin
# using dedicated multi-role QA fixtures stored as GitHub ENVIRONMENT secrets
# (environment: qa-broker-gate). The repo-level production secrets are never
# touched by this gate.
#
# Mandatory role coverage (zero skipped allowed):
#   - Worker (owner) and second worker (non-owner)
#   - Verified company WITH an active relationship (authorized)
#   - Verified company WITHOUT any relationship (cross_tenant)
#   - UNVERIFIED company (company_not_verified, denied before file resolution)
#   - Verified company whose only relationship is terminal (relationship_expired)
#   - Legitimate admin
#
# Target resolution:
#   - target_url EMPTY (default): the workflow deploys an EPHEMERAL QA gate
#     Worker (pipingbox-app-gate-<sha8>.pipingbox.workers.dev) built from the
#     exact source_ref with the QA Supabase env, verifies the served bundle
#     embeds the exact SHA, runs the gate against it and deletes the Worker
#     afterwards. This NEVER touches app.pipingbox.com, the preview Worker,
#     DNS, routes or production Supabase.
#   - target_url SET: the gate runs against that explicit HTTPS origin (used
#     by callers that already deployed a candidate). It must never be a
#     production origin for routine QA runs.
#
# Exit criteria: passed > 0, skipped = 0, failed = 0, timedOut = 0.
# Any skipped test fails the gate: the fixtures must be deterministic.

on:
  workflow_call:
    inputs:
      target_url:
        description: 'Explicit HTTPS origin to test. Leave empty to deploy an ephemeral QA gate Worker from source_ref.'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Exact app commit/ref whose E2E tests must be executed'
        required: true
        type: string
    secrets:
      E2E_WORKER_EMAIL:
        required: true
      E2E_WORKER_PASSWORD:
        required: true
      E2E_SECOND_WORKER_EMAIL:
        required: true
      E2E_SECOND_WORKER_PASSWORD:
        required: true
      E2E_COMPANY_AUTHORIZED_EMAIL:
        required: true
      E2E_COMPANY_AUTHORIZED_PASSWORD:
        required: true
      E2E_COMPANY_UNAUTHORIZED_EMAIL:
        required: true
      E2E_COMPANY_UNAUTHORIZED_PASSWORD:
        required: true
      E2E_COMPANY_UNVERIFIED_EMAIL:
        required: true
      E2E_COMPANY_UNVERIFIED_PASSWORD:
        required: true
      E2E_COMPANY_EXPIRED_EMAIL:
        required: true
      E2E_COMPANY_EXPIRED_PASSWORD:
        required: true
      E2E_ADMIN_EMAIL:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      VITE_SUPABASE_URL:
        required: true
      VITE_SUPABASE_ANON_KEY:
        required: true

  workflow_dispatch:
    inputs:
      target_url:
        description: 'Explicit HTTPS origin to test. Leave EMPTY to deploy an ephemeral QA gate Worker from source_ref (default, QA-only path).'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Exact app commit/ref whose E2E tests must be executed'
        required: true
        type: string

jobs:
  broker-e2e:
    name: secure-file-access broker E2E — zero skipped allowed
    runs-on: ubuntu-latest
    # QA fixtures and QA Supabase live in this GitHub Environment so the gate
    # can never silently resolve the repo-level production secrets.
    environment: qa-broker-gate
    permissions:
      contents: read
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      E2E_WORKER_EMAIL: ${{ secrets.E2E_WORKER_EMAIL }}
      E2E_WORKER_PASSWORD: ${{ secrets.E2E_WORKER_PASSWORD }}
      E2E_SECOND_WORKER_EMAIL: ${{ secrets.E2E_SECOND_WORKER_EMAIL }}
      E2E_SECOND_WORKER_PASSWORD: ${{ secrets.E2E_SECOND_WORKER_PASSWORD }}
      E2E_COMPANY_AUTHORIZED_EMAIL: ${{ secrets.E2E_COMPANY_AUTHORIZED_EMAIL }}
      E2E_COMPANY_AUTHORIZED_PASSWORD: ${{ secrets.E2E_COMPANY_AUTHORIZED_PASSWORD }}
      E2E_COMPANY_UNAUTHORIZED_EMAIL: ${{ secrets.E2E_COMPANY_UNAUTHORIZED_EMAIL }}
      E2E_COMPANY_UNAUTHORIZED_PASSWORD: ${{ secrets.E2E_COMPANY_UNAUTHORIZED_PASSWORD }}
      E2E_COMPANY_UNVERIFIED_EMAIL: ${{ secrets.E2E_COMPANY_UNVERIFIED_EMAIL }}
      E2E_COMPANY_UNVERIFIED_PASSWORD: ${{ secrets.E2E_COMPANY_UNVERIFIED_PASSWORD }}
      E2E_COMPANY_EXPIRED_EMAIL: ${{ secrets.E2E_COMPANY_EXPIRED_EMAIL }}
      E2E_COMPANY_EXPIRED_PASSWORD: ${{ secrets.E2E_COMPANY_EXPIRED_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Validate target and multi-role fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PREVIEW_URL:-}" ]; then
            case "$PREVIEW_URL" in
              https://*) ;;
              *) echo "::error::Broker E2E target must use HTTPS."; exit 1 ;;
            esac
            case "$PREVIEW_URL" in
              https://app.pipingbox.com*|https://pipingbox.com*|https://www.pipingbox.com*)
                echo "::error::Refusing to run the broker gate against a production origin."
                exit 1
                ;;
            esac
            echo "Explicit target: $PREVIEW_URL"
          else
            echo "No explicit target: an ephemeral QA gate Worker will be deployed from source_ref."
          fi

          MISSING=""
          for VAR in \
            E2E_WORKER_EMAIL E2E_WORKER_PASSWORD \
            E2E_SECOND_WORKER_EMAIL E2E_SECOND_WORKER_PASSWORD \
            E2E_COMPANY_AUTHORIZED_EMAIL E2E_COMPANY_AUTHORIZED_PASSWORD \
            E2E_COMPANY_UNAUTHORIZED_EMAIL E2E_COMPANY_UNAUTHORIZED_PASSWORD \
            E2E_COMPANY_UNVERIFIED_EMAIL E2E_COMPANY_UNVERIFIED_PASSWORD \
            E2E_COMPANY_EXPIRED_EMAIL E2E_COMPANY_EXPIRED_PASSWORD \
            E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD \
            VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          do
            if [ -z "${!VAR:-}" ]; then
              MISSING="${MISSING} ${VAR}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required broker E2E secrets:${MISSING}"
            exit 1
          fi

          case "$VITE_SUPABASE_URL" in
            *mwdauubztjxkbrefirbg*)
              echo "::error::VITE_SUPABASE_URL points at the PRODUCTION project. The broker gate must run against QA."
              exit 1
              ;;
          esac

          echo "All broker E2E fixtures present (6 roles + QA Supabase)."

      - name: Checkout exact tested app ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch to exact tested SHA
        env:
          INPUT_SHA: ${{ inputs.source_ref }}
        run: git checkout "$INPUT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: npm ci

      - name: Deploy ephemeral QA gate Worker
        if: ${{ inputs.target_url == '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_APP_VERSION: ${{ inputs.source_ref }}
          VITE_APP_ENV: qa-broker-gate
        run: |
          set -euo pipefail
          INPUT_SHA="${{ inputs.source_ref }}"
          GATE_NAME="pipingbox-app-gate-${INPUT_SHA:0:8}"
          echo "GATE_NAME=$GATE_NAME" >> "$GITHUB_ENV"
          npm --prefix app/frontend ci
          npx wrangler deploy --name "$GATE_NAME"
          echo "PREVIEW_URL=https://${GATE_NAME}.pipingbox.workers.dev" >> "$GITHUB_ENV"

      - name: Verify served QA bundle embeds the exact SHA
        if: ${{ inputs.target_url == '' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BASE="https://${GATE_NAME}.pipingbox.workers.dev"
          found=0
          for attempt in $(seq 1 12); do
            status="$(curl -s -o /tmp/pb_gate_shell.html -w '%{http_code}' \
              -H 'Accept: text/html' -H 'Cache-Control: no-cache' \
              "$BASE/?sha_preflight=$EXPECTED_SHA" || true)"
            html_bytes="$(wc -c < /tmp/pb_gate_shell.html 2>/dev/null || echo 0)"
            assets=""
            if [ "$status" = "200" ] && [ "$html_bytes" -gt 0 ]; then
              assets="$(grep -oE '(src|href)="[^"]+\.(js|mjs)"' /tmp/pb_gate_shell.html \
                | sed -E 's/^(src|href)="//; s/"$//' | sort -u || true)"
            fi
            echo "attempt $attempt: http=$status html_bytes=$html_bytes"
            for a in $assets; do
              case "$a" in
                http*) url="$a" ;;
                /*)    url="$BASE$a" ;;
                *)     url="$BASE/$a" ;;
              esac
              # Download-then-grep, NEVER `curl | grep -q` (SIGPIPE under pipefail).
              if curl -sf -o /tmp/pb_gate_asset.js "$url" \
                && grep -q "$EXPECTED_SHA" /tmp/pb_gate_asset.js; then
                found=1
                echo "Served QA bundle carries the expected SHA: $EXPECTED_SHA (asset: $url)"
                break
              fi
            done
            [ "$found" = "1" ] && break
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "::error::Served QA bundle does NOT embed $EXPECTED_SHA. Aborting gate."
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run broker access E2E — zero skipped allowed
        shell: bash
        run: |
          set -euo pipefail
          echo "Broker gate target: $PREVIEW_URL"

          set +e
          npx playwright test tests/secure-file-access-broker.spec.ts \
            --config=playwright.config.ts \
            --reporter=json \
            --output=playwright-output | tee playwright-results.json
          PW_EXIT=${PIPESTATUS[0]}
          set -e

          if [ ! -f playwright-results.json ]; then
            echo "::error::Playwright did not produce a JSON results file."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
          const statuses = [];
          const failures = [];
          const skippedTitles = [];

          function walk(value) {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) walk(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (result && typeof result.status === 'string') {
                  statuses.push(result.status);
                  const title = result.title || value.title || 'unknown';
                  if (result.status === 'skipped') {
                    skippedTitles.push(title);
                  }
                  if (result.status === 'failed' || result.status === 'timedOut' || result.status === 'interrupted') {
                    failures.push({
                      title,
                      status: result.status,
                      error: (result.error && result.error.message) || (result.errors && result.errors.map(e => e.message).join('; ')) || 'no message',
                    });
                  }
                }
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') walk(child);
            }
          }

          walk(report);

          const count = (status) => statuses.filter((s) => s === status).length;
          const passed = count('passed');
          const skipped = count('skipped');
          const failed = count('failed');
          const timedOut = count('timedOut');
          const interrupted = count('interrupted');

          console.log(`Broker E2E result: passed=${passed}, skipped=${skipped}, failed=${failed}, timedOut=${timedOut}, interrupted=${interrupted}`);

          if (failures.length > 0) {
            console.error('::group::Broker E2E failures');
            for (const f of failures) {
              console.error(`FAIL: ${f.title} [${f.status}]`);
              console.error(f.error);
            }
            console.error('::endgroup::');
          }

          if (skippedTitles.length > 0) {
            console.error('::group::Broker E2E skipped tests');
            for (const t of skippedTitles) console.error(`SKIPPED: ${t}`);
            console.error('::endgroup::');
          }

          if (statuses.length === 0) {
            console.error('::error::Playwright produced no executable broker E2E results.');
            process.exit(1);
          }
          if (skipped > 0) {
            console.error(`::error::Broker E2E gate rejected ${skipped} skipped test(s). QA fixtures must be deterministic.`);
            process.exit(1);
          }
          if (failed > 0 || timedOut > 0 || interrupted > 0) {
            console.error('::error::Broker E2E gate contains failed/timed-out/interrupted tests.');
            process.exit(1);
          }
          if (passed === 0) {
            console.error('::error::Broker E2E gate requires passed > 0.');
            process.exit(1);
          }

          console.log(`Broker E2E gate PASS: ${passed}/${passed} tests passed, zero skipped.`);
          NODE

          exit ${PW_EXIT}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-output/
            playwright-results.json
          retention-days: 3

      - name: Delete ephemeral QA gate Worker
        if: ${{ always() && inputs.target_url == '' && env.GATE_NAME != '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if npx wrangler delete --name "$GATE_NAME" --force; then
            echo "Ephemeral QA gate Worker $GATE_NAME deleted."
          else
            echo "::warning::Could not delete $GATE_NAME (token scope). It is route-less QA-only infrastructure; delete it manually from the Cloudflare dashboard."
          fi
