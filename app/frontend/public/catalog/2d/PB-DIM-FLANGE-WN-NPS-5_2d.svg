  <text x="246.2" y="464" class="dim-text">Hub L</text>
  <text x="246.2" y="486" class="dim-sub">3.500" | 88.900 mm</text>
  
  <line x1="195.2" y1="226.9" x2="195.2" y2="373.1" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="187.2" y="256.988" class="dim-text" text-anchor="end">RF</text>
  <text x="187.2" y="271.988" class="dim-sub" text-anchor="end">7.310" | 185.670 mm</text>
