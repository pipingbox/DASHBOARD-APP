  <text x="550" y="182" class="tbl-key">Class</text><text x="750" y="182" class="tbl-val">150</text>
  <text x="550" y="199" class="tbl-key">D (flange OD)</text><text x="750" y="199" class="tbl-val">10.000" | 254.000 mm</text>
  <text x="550" y="216" class="tbl-key">BCD</text><text x="750" y="216" class="tbl-val">8.500" | 215.900 mm</text>
  <text x="550" y="233" class="tbl-key">T (thickness)</text><text x="750" y="233" class="tbl-val">0.940" | 23.880 mm</text>
  <text x="550" y="250" class="tbl-key">Hub length</text><text x="750" y="250" class="tbl-val">3.500" | 88.900 mm</text>
  <text x="550" y="267" class="tbl-key">RF dia</text><text x="750" y="267" class="tbl-val">7.310" | 185.670 mm</text>
