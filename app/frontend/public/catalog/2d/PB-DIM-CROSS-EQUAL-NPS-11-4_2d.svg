<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .profile   { stroke: #1a1a1a; stroke-width: 2; fill: #e2e5e8; }
      .bore      { stroke: #555; stroke-width: 1; fill: none; stroke-dasharray: 4 2; }
      .centerline{ stroke: #999; stroke-width: 0.8; stroke-dasharray: 8 4; fill: none; }
      .dim-line  { stroke: #c62828; stroke-width: 0.9; fill: none; }
      .dim-text  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c62828; text-anchor: middle; }
      .dim-sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #c62828; text-anchor: middle; }
      .label     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .subtitle  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #555; }
      .std-ref   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; }
      .note      { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #888; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="800" height="700" fill="#fafafa"/>

  <!-- TITLE -->
  <text x="40" y="40" class="title">Equal Cross</text>
  <text x="40" y="60" class="subtitle">NPS 1-1/4 (DN 32) — Butt Weld Ends</text>
  <text x="40" y="78" class="std-ref">ASME B16.9-2018 | 4-way equal cross</text>

  <!-- CROSS PROFILE (plus-sign shape with 4 arms) -->
  <path d="M 300 170
           L 400 170
           L 400 300
           L 530 300
           L 530 400
           L 400 400
           L 400 530
           L 300 530
           L 300 400
           L 170 400
           L 170 300
           L 300 300
           Z" class="profile"/>

  <!-- Bore lines on all 4 arms -->
  <!-- Top arm -->
  <line x1="307" y1="300" x2="307" y2="170" class="bore"/>
  <line x1="393" y1="300" x2="393" y2="170" class="bore"/>
  <!-- Bottom arm -->
  <line x1="307" y1="400" x2="307" y2="530" class="bore"/>
  <line x1="393" y1="400" x2="393" y2="530" class="bore"/>
  <!-- Left arm -->
  <line x1="300" y1="307" x2="170" y2="307" class="bore"/>
  <line x1="300" y1="393" x2="170" y2="393" class="bore"/>
  <!-- Right arm -->
  <line x1="400" y1="307" x2="530" y2="307" class="bore"/>
  <line x1="400" y1="393" x2="530" y2="393" class="bore"/>

  <!-- CENTERLINES extending beyond fitting -->
  <line x1="140" y1="350" x2="560" y2="350" class="centerline"/>
  <line x1="350" y1="140" x2="350" y2="560" class="centerline"/>

  <!-- CL labels -->
  <text x="570" y="344" class="label" fill="#999">CL</text>
  <text x="360" y="135" class="label" fill="#999">CL</text>

  <!-- DIM C (run center-to-end, right side) -->
  <line x1="350" y1="350" x2="350" y2="590" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="530" y1="400" x2="530" y2="590" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="350" y1="575" x2="530" y2="575"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="440" y="570" class="dim-text">C</text>
  <text x="440" y="590" class="dim-sub">1.620" | 41.1 mm</text>

  <!-- DIM M (branch center-to-end, top side) -->
  <line x1="350" y1="350" x2="220" y2="350" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="300" y1="170" x2="220" y2="170" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="235" y1="350" x2="235" y2="170"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="220" y="260" class="dim-text"
        transform="rotate(-90 220 260)">M</text>
  <text x="200" y="260" class="dim-sub"
        transform="rotate(-90 200 260)">1.620" | 41.1 mm</text>

  <!-- DIM D (OD at right end) -->
  <line x1="530" y1="300" x2="580" y2="300" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="530" y1="400" x2="580" y2="400" class="dim-line" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="565" y1="300" x2="565" y2="400"
        class="dim-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="595" y="346" class="dim-text">D</text>
  <text x="595" y="362" class="dim-sub">1.660"</text>
  <text x="595" y="376" class="dim-sub">42.2 mm</text>

  <!-- NOTES -->
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="652" class="note">Dimensions per ASME B16.9-2018, Table 1.</text>
  <text x="40" y="666" class="note">C = run center-to-end. M = branch center-to-end. D = outside diameter.</text>
  <text x="40" y="680" class="note">Equal cross: all four ends same OD. All dimensions in inches and millimeters.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>

  <!-- DATA TABLE -->
  <rect x="530" y="100" width="240" height="160" rx="4" fill="white" stroke="#ddd" stroke-width="0.8"/>
  <text x="650" y="120" class="label" font-weight="600" fill="#1a1a1a">NPS 1-1/4 — Key Data</text>
  <line x1="545" y1="128" x2="755" y2="128" stroke="#eee" stroke-width="0.5"/>
  <text x="560" y="145" class="note" text-anchor="start" fill="#555">NPS / DN</text>
  <text x="735" y="145" class="note" text-anchor="end">1-1/4 / 32</text>
  <text x="560" y="162" class="note" text-anchor="start" fill="#555">C (run center-to-end)</text>
  <text x="735" y="162" class="note" text-anchor="end">1.620" | 41.1 mm</text>
  <text x="560" y="179" class="note" text-anchor="start" fill="#555">M (branch c-to-e)</text>
  <text x="735" y="179" class="note" text-anchor="end">1.620" | 41.1 mm</text>
  <text x="560" y="196" class="note" text-anchor="start" fill="#555">D (outside dia.)</text>
  <text x="735" y="196" class="note" text-anchor="end">1.660" | 42.2 mm</text>
  <text x="560" y="213" class="note" text-anchor="start" fill="#555">Standard</text>
  <text x="735" y="213" class="note" text-anchor="end">ASME B16.9-2018</text>
  <text x="560" y="230" class="note" text-anchor="start" fill="#555">End type</text>
  <text x="735" y="230" class="note" text-anchor="end">Butt Weld (BW)</text>

</svg>