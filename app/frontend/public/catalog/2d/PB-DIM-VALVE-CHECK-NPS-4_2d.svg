<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs><style>
    .profile{stroke:#1a1a1a;stroke-width:2;fill:#e2e5e8}
    .bore{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:4 2}
    .centerline{stroke:#999;stroke-width:.8;stroke-dasharray:8 4;fill:none}
    .dim-line{stroke:#c62828;stroke-width:.9;fill:none}
    .dim-text{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#c62828;text-anchor:middle}
    .dim-sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c62828;text-anchor:middle}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;fill:#1a1a1a}
    .subtitle{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#555}
    .std-ref{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#888}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888}
    .label{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#999;text-anchor:middle}
    .tbl-hdr{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#1a1a1a;font-weight:600;text-anchor:middle}
    .tbl-key{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#555;text-anchor:start}
    .tbl-val{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888;text-anchor:end}
  </style>
  <marker id="as" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  <marker id="ae" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Check Valve</text>
  <text x="40" y="60" class="subtitle">NPS 4 (DN 100) — Class 150 — Flanged Ends</text>
  <text x="40" y="78" class="std-ref">API 594 | Check Valve</text>
  <rect x="321" y="344" width="58" height="53" rx="8" class="profile"/>
  <rect x="309" y="343" width="12" height="53" fill="#c8cdd2" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="379" y="343" width="12" height="53" fill="#c8cdd2" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="309" y1="370" x2="391" y2="370" class="bore"/>
  <line x1="279" y1="370" x2="421" y2="370" class="centerline"/>
  <text x="274" y="374" class="label" text-anchor="end">CL</text>
  <line x1="308.75" y1="406.325" x2="308.75" y2="441.325" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="391.25" y1="406.325" x2="391.25" y2="441.325" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="308.75" y1="436.325" x2="391.25" y2="436.325" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="350" y="429.325" class="dim-text">F-to-F</text>
  <text x="350" y="451.325" class="dim-sub">3.250" | 82.6 mm</text>
  <rect x="540" y="100" width="240" height="152" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="660" y="120" class="tbl-hdr">NPS 4 — Key Data</text>
  <line x1="555" y1="128" x2="765" y2="128" stroke="#eee" stroke-width=".5"/>
  <text x="560" y="145" class="tbl-key">NPS / DN</text>
  <text x="760" y="145" class="tbl-val">4 / 100</text>
  <text x="560" y="162" class="tbl-key">Class</text>
  <text x="760" y="162" class="tbl-val">150</text>
  <text x="560" y="179" class="tbl-key">F-to-F</text>
  <text x="760" y="179" class="tbl-val">3.250" | 82.6 mm</text>
  <text x="560" y="196" class="tbl-key">Weight</text>
  <text x="760" y="196" class="tbl-val">18 kg</text>
  <text x="560" y="213" class="tbl-key">Standard</text>
  <text x="760" y="213" class="tbl-val">API 594</text>
  <text x="560" y="230" class="tbl-key">End type</text>
  <text x="760" y="230" class="tbl-val">Flanged RF</text>
  <line x1="40" y1="630" x2="760" y2="630" stroke="#ddd" stroke-width=".5"/>
  <text x="40" y="648" class="note">Check Valve per API 594, Class 150, Flanged RF ends.</text>
  <text x="40" y="663" class="note">F-to-F = face-to-face. H = center of bore to top of actuator.</text>
  <text x="40" y="678" class="note">Weight is approximate. All dimensions in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
</svg>