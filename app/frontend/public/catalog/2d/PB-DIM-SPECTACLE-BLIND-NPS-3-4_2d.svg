<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs><style>
    .profile{stroke:#1a1a1a;stroke-width:2;fill:#e2e5e8}
    .bore{stroke:#555;stroke-width:1;fill:none;stroke-dasharray:4 2}
    .centerline{stroke:#999;stroke-width:.8;stroke-dasharray:8 4;fill:none}
    .dim-line{stroke:#c62828;stroke-width:.9;fill:none}
    .dim-text{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#c62828;text-anchor:middle}
    .dim-sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c62828;text-anchor:middle}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;fill:#1a1a1a}
    .subtitle{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#555}
    .std-ref{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#888}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888}
    .label{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#999;text-anchor:middle}
    .tbl-hdr{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#1a1a1a;font-weight:600;text-anchor:middle}
    .tbl-key{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#555;text-anchor:start}
    .tbl-val{font-family:'Segoe UI',Arial,sans-serif;font-size:10.5px;fill:#888;text-anchor:end}
  </style>
  <marker id="as" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  <marker id="ae" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#c62828" stroke-width=".8"/></marker>
  </defs>
  <rect width="800" height="700" fill="#fafafa"/>
  <text x="40" y="40" class="title">Spectacle Blind</text>
  <text x="40" y="60" class="subtitle">NPS 3/4 (DN 20) — Class 150</text>
  <text x="40" y="78" class="std-ref">ASME B16.48-2015 | Figure-8 blind</text>
  <rect x="283" y="312" width="175" height="16" fill="#d0d5da" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="240" cy="320" r="43" fill="#c8cdd2" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="324" class="label" font-weight="600" fill="#555">BLIND</text>
  <circle cx="270" cy="320" r="4" fill="white" stroke="#1a1a1a" stroke-width=".8"/>
