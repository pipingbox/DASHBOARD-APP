  <line x1="270.5" y1="427.25" x2="270.5" y2="462.25" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="429.5" y1="427.25" x2="429.5" y2="462.25" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="270.5" y1="457.25" x2="429.5" y2="457.25" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
