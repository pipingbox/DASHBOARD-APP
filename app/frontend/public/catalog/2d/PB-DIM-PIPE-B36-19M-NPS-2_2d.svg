  <circle cx="330" cy="299" r="2" fill="#c62828"/>
  <text x="330" y="195" class="dim-text">ID</text>
  <text x="330" y="211" class="dim-sub">2.067" | 52.48 mm</text>
  <rect x="520" y="130" width="250" height="152" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="645" y="150" class="tbl-hdr">NPS 2 — Key Data</text>
