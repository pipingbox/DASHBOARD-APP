  <text x="298" y="326" class="dim-text" text-anchor="end">WT</text>
  <text x="298" y="340.27386360737626" class="dim-sub" text-anchor="end">0.113" | 2.87 mm</text>
  <line x1="330" y1="318" x2="330" y2="241" stroke="#c62828" stroke-width=".6"/>
  <circle cx="330" cy="318" r="2" fill="#c62828"/>
  <text x="330" y="235" class="dim-text">ID</text>
  <text x="330" y="251" class="dim-sub">0.824" | 20.96 mm</text>
  <rect x="520" y="130" width="250" height="152" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="645" y="150" class="tbl-hdr">NPS 3/4 — Key Data</text>
