  <line x1="509.24" y1="305.76" x2="509.24" y2="246.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="530" y="60" width="240" height="186" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
