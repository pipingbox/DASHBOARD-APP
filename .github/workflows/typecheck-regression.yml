name: TypeScript Regression Gate

# PB-INFRA-TS-ZERO-GATE-001: STRICT ZERO-ERROR TYPECHECK.
#
# The TypeScript debt campaign is CLOSED (31 diagnostics / 23 fingerprints
# -> 0 / 0). The transitional baseline mechanism
# (scripts/ts-regression-gate.mjs + scripts/ts-error-baseline.txt) has been
# retired; the gate is now a strict zero-error typecheck.
#
# Policy: ZERO TYPE ERRORS. Success condition is exclusively
# `npm run typecheck` exit code 0 in app/frontend
# (`tsc -p tsconfig.app.json --noEmit --skipLibCheck` — the authoritative
# command). Any TypeScript diagnostic fails this check and blocks the PR.
# No baselines, no known-error tolerances, no fingerprint normalization.
#
# Note: the check display name "TypeScript Regression Gate" is preserved on
# purpose so GitHub branch protection keeps matching the required check.
# The historical `npx tsc --skipLibCheck` against the solution-style root
# tsconfig.json remains DEPRECATED (it compiles nothing and always exits 0).

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/typecheck-regression.yml'

concurrency:
  group: typecheck-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci

      - name: Strict zero-error typecheck
        working-directory: app/frontend
        run: npm run typecheck
