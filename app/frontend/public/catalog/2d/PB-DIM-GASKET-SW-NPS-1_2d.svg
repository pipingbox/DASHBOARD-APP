  <line x1="320" y1="240" x2="320" y2="380" class="centerline"/>
  <text x="396" y="314" class="label" text-anchor="start">CL</text>
  <line x1="302.5" y1="395.5" x2="337.5" y2="395.5" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
