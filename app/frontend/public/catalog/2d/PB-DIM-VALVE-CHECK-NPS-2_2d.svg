  <line x1="555" y1="128" x2="755" y2="128" stroke="#eee" stroke-width=".5"/><text x="560" y="145" class="tbl-key">NPS / DN</text><text x="750" y="145" class="tbl-val">2 / 50</text><text x="560" y="162" class="tbl-key">Class</text><text x="750" y="162" class="tbl-val">150</text><text x="560" y="179" class="tbl-key">F-to-F</text><text x="750" y="179" class="tbl-val">2.36" | 60 mm</text><text x="560" y="196" class="tbl-key">OD body</text><text x="750" y="196" class="tbl-val">5.75" | 146.1 mm</text><text x="560" y="213" class="tbl-key">Weight</text><text x="750" y="213" class="tbl-val">5 kg</text><text x="560" y="230" class="tbl-key">Standard</text><text x="750" y="230" class="tbl-val">API 594</text><text x="560" y="247" class="tbl-key">End type</text><text x="750" y="247" class="tbl-val">Wafer (between flanges)</text>
