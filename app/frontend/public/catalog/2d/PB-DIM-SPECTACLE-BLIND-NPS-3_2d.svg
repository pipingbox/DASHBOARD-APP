  <text x="240" y="430.5" class="dim-text">D</text>
  <text x="240" y="452.5" class="dim-sub">7.500" | 190.5 mm</text>
  <line x1="157.5" y1="407.5" x2="157.5" y2="442.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="322.5" y1="407.5" x2="322.5" y2="442.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="461.5" y1="207.5" x2="538.5" y2="207.5" class="dim-line" marker-start="url(#as)" marker-end="url(#ae)"/>
  <text x="500" y="200.5" class="dim-text">Pipe OD</text>
  <text x="500" y="222.5" class="dim-sub">3.500" | 88.9 mm</text>
  <line x1="461.5" y1="276.5" x2="461.5" y2="202.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <line x1="538.5" y1="276.5" x2="538.5" y2="202.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="530" y="60" width="240" height="186" rx="4" fill="white" stroke="#ddd" stroke-width=".8"/>
  <text x="650" y="80" class="tbl-hdr">NPS 3 — Key Data</text>
  <line x1="545" y1="88" x2="755" y2="88" stroke="#eee" stroke-width=".5"/>
  <text x="550" y="105" class="tbl-key">NPS / DN</text>
  <text x="750" y="105" class="tbl-val">3 / 80</text>
  <text x="550" y="122" class="tbl-key">Class</text>
  <text x="750" y="122" class="tbl-val">150</text>
  <text x="550" y="139" class="tbl-key">D (disc OD)</text>
  <text x="750" y="139" class="tbl-val">7.500" | 190.5 mm</text>
  <text x="550" y="156" class="tbl-key">Pipe OD (spacer hole)</text>
  <text x="750" y="156" class="tbl-val">3.500" | 88.9 mm</text>
