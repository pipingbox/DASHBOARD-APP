  <line x1="484.5" y1="140.5" x2="484.5" y2="110.5" stroke="#c62828" stroke-width=".5" stroke-dasharray="2 2"/>
  <rect x="600" y="480" width="60" height="8" rx="1" fill="#b8bfc6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="472" class="dim-text">T</text>
  <text x="630" y="503" class="dim-sub">0.175" | 4.4 mm</text>
