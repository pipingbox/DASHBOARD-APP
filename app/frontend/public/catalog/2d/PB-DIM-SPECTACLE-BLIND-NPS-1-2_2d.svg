  <text x="40" y="648" class="note">Spectacle Blind per ASME B16.48-2015, Class 150.</text>
  <text x="40" y="663" class="note">Figure-8 design: blind disc + spacer ring connected by bar.</text>
  <text x="40" y="678" class="note">Bolt pattern matches mating flange. All dimensions in inches and mm.</text>
  <text x="760" y="692" class="note" text-anchor="end" fill="#ccc">PIPINGBOX</text>
</svg>