  <circle cx="320" cy="310" r="18" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="20" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
  <circle cx="320" cy="310" r="23" fill="none" stroke="#9aa0a6" stroke-width=".4"/>
